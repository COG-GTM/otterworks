# ClusterSecretStores for OtterWorks app secrets/config (docs/SECRETS.md).
# Applied by demo-platform/scripts/install-external-secrets.sh, which fills in
# ${AWS_REGION}. Shared platform objects: one pair per cluster, never per tenant.
#
# No credentials here: with no `auth` block the AWS provider uses the ESO
# controller's own identity, i.e. its IRSA role (Terraform module
# infrastructure/terraform/modules/secrets), which can only read
# otterworks/<env>/* secrets and /otterworks/<env>/* parameters.
#
# Only the golden namespace and tenant namespaces may reference these stores.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: otterworks-secretsmanager
  labels:
    app.kubernetes.io/part-of: otterworks-platform
spec:
  provider:
    aws:
      service: SecretsManager
      region: ${AWS_REGION}
  conditions:
    - namespaceRegexes:
        - "^otterworks(-[a-z0-9-]+)?$"
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: otterworks-parameterstore
  labels:
    app.kubernetes.io/part-of: otterworks-platform
spec:
  provider:
    aws:
      service: ParameterStore
      region: ${AWS_REGION}
  conditions:
    - namespaceRegexes:
        - "^otterworks(-[a-z0-9-]+)?$"
