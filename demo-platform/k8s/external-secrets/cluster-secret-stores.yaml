# ClusterSecretStores for OtterWorks app secrets/config (docs/SECRETS.md).
# Applied by demo-platform/scripts/install-external-secrets.sh, which fills in
# ${AWS_REGION}, ${GOLDEN_NAMESPACE} and ${ESO_TENANT_ROLE_ARN}. Shared platform
# objects: one set per cluster, never per tenant.
#
# No static credentials anywhere. The golden stores have no `auth` block, so
# the AWS provider uses the ESO controller's own IRSA role (Terraform module
# infrastructure/terraform/modules/secrets): read-only, otterworks/<env>/<svc>/*.
# Namespace conditions only check who references a store, not which keys they
# ask for, so the golden stores are limited to the golden namespace, and tenant
# namespaces get their own store that assumes a narrower role (DB_PASSWORD
# keys only, never JWT/session signing keys).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: otterworks-secretsmanager
  labels:
    app.kubernetes.io/part-of: otterworks-platform
spec:
  provider:
    aws:
      service: SecretsManager
      region: ${AWS_REGION}
  conditions:
    - namespaces:
        - ${GOLDEN_NAMESPACE}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: otterworks-parameterstore
  labels:
    app.kubernetes.io/part-of: otterworks-platform
spec:
  provider:
    aws:
      service: ParameterStore
      region: ${AWS_REGION}
  conditions:
    - namespaces:
        - ${GOLDEN_NAMESPACE}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: otterworks-tenant-secretsmanager
  labels:
    app.kubernetes.io/part-of: otterworks-platform
spec:
  provider:
    aws:
      service: SecretsManager
      region: ${AWS_REGION}
      role: ${ESO_TENANT_ROLE_ARN}
  conditions:
    - namespaceRegexes:
        - "^otterworks-[a-z0-9-]+$"
