# Local/offline stand-in for the ACME ClusterIssuers in cluster-issuer.yaml, for
# kind/k3d clusters that have no public DNS (see docs/GITOPS.md "Local
# validation"). Never apply this to EKS.
#
# selfSigned bootstraps a root CA, which then backs a CA ClusterIssuer named
# like the real one, so the wildcard-certificate.yaml flow is exercised as-is.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: otterworks-local-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: otterworks-local-root-ca
  secretName: otterworks-local-root-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: otterworks-local-ca
spec:
  ca:
    secretName: otterworks-local-root-ca
