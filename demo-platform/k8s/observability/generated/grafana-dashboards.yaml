apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-incident-overview
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
    app.kubernetes.io/part-of: otterworks-observability
  annotations:
    grafana_folder: OtterWorks
data:
  incident-overview.json: |
    {
      "id": null,
      "uid": "otterworks-incident-overview",
      "title": "OtterWorks Incident Overview",
      "description": "Cross-service incident overview showing error rates, latencies, and active alerts across all OtterWorks services",
      "tags": [
        "otterworks",
        "incident",
        "overview"
      ],
      "timezone": "utc",
      "editable": true,
      "graphTooltip": 1,
      "refresh": "10s",
      "time": {
        "from": "now-30m",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "Prometheus",
              "value": "Prometheus"
            }
          }
        ]
      },
      "panels": [
        {
          "title": "Error Rates",
          "type": "row",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "collapsed": false
        },
        {
          "title": "All Services - 5xx Error Rate",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "fillOpacity": 10,
                "pointSize": 5,
                "showPoints": "auto"
              },
              "thresholds": {
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 0.01
                  },
                  {
                    "color": "red",
                    "value": 0.05
                  }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "sum by (job) (rate(http_requests_total{status=~\"5..\"}[5m])) / sum by (job) (rate(http_requests_total[5m]))",
              "legendFormat": "{{job}}"
            },
            {
              "expr": "sum(rate(search_service_requests_total{status=~\"5..\"}[5m])) / sum(rate(search_service_requests_total[5m]))",
              "legendFormat": "search-service"
            },
            {
              "expr": "sum(rate(notifications_processing_errors_total[5m])) / clamp_min(sum(rate(notifications_processing_errors_total[5m])) + 1, 1)",
              "legendFormat": "notification-service (consumer)"
            }
          ],
          "description": "5xx error rate for all services. A spike here indicates a service returning server errors."
        },
        {
          "title": "Latencies",
          "type": "row",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 9
          },
          "collapsed": false
        },
        {
          "title": "All Services - P95 Latency",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 10
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "min": 0,
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "smooth",
                "fillOpacity": 10,
                "pointSize": 5,
                "showPoints": "auto"
              },
              "thresholds": {
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 3
                  }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (job, le) (rate(http_request_duration_seconds_bucket[5m])))",
              "legendFormat": "{{job}}"
            }
          ],
          "description": "P95 latency across all services. A spike above 1s (warning) or 3s (critical) indicates performance degradation."
        },
        {
          "title": "Alerts and Diagnostics",
          "type": "row",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 18
          },
          "collapsed": false
        },
        {
          "title": "Active Alert Count",
          "type": "stat",
          "gridPos": {
            "h": 6,
            "w": 8,
            "x": 0,
            "y": 19
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short",
              "min": 0,
              "thresholds": {
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 3
                  }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "count(ALERTS{alertstate=\"firing\"}) or vector(0)",
              "legendFormat": "Firing Alerts"
            }
          ],
          "description": "Total number of Prometheus alerts currently in firing state"
        },
        {
          "title": "Active Alerts Detail",
          "type": "table",
          "gridPos": {
            "h": 6,
            "w": 16,
            "x": 8,
            "y": 19
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {}
          },
          "targets": [
            {
              "expr": "ALERTS{alertstate=\"firing\"}",
              "legendFormat": "{{alertname}} - {{job}}",
              "format": "table",
              "instant": true
            }
          ],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "Value": true
                }
              }
            }
          ],
          "description": "Details of all currently firing alerts"
        },
        {
          "title": "Trace Search Links",
          "type": "row",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 25
          },
          "collapsed": false
        },
        {
          "title": "Jaeger Trace Search",
          "type": "text",
          "gridPos": {
            "h": 6,
            "w": 24,
            "x": 0,
            "y": 26
          },
          "options": {
            "mode": "markdown",
            "content": "### Trace Search by Service\n\nClick a service name to open Jaeger trace search filtered to that service:\n\n| Service | Language | Jaeger Link |\n|---------|----------|-------------|\n| api-gateway | Go | [Search Traces](http://jaeger:16686/search?service=api-gateway) |\n| auth-service | Java | [Search Traces](http://jaeger:16686/search?service=auth-service) |\n| file-service | Rust | [Search Traces](http://jaeger:16686/search?service=file-service) |\n| document-service | Python | [Search Traces](http://jaeger:16686/search?service=document-service) |\n| collab-service | Node.js | [Search Traces](http://jaeger:16686/search?service=collab-service) |\n| notification-service | Kotlin | [Search Traces](http://jaeger:16686/search?service=notification-service) |\n| search-service | Python | [Search Traces](http://jaeger:16686/search?service=search-service) |\n| analytics-service | Scala | [Search Traces](http://jaeger:16686/search?service=analytics-service) |\n| admin-service | Ruby | [Search Traces](http://jaeger:16686/search?service=admin-service) |\n| audit-service | C# | [Search Traces](http://jaeger:16686/search?service=audit-service) |"
          },
          "description": "Quick links to Jaeger trace search for each OtterWorks service"
        }
      ],
      "links": [
        {
          "title": "Chaos Scenarios",
          "url": "/d/otterworks-chaos-scenarios",
          "type": "link",
          "icon": "bolt",
          "tooltip": "View chaos engineering scenario dashboards"
        },
        {
          "title": "OtterWorks Overview",
          "url": "/d/otterworks-overview",
          "type": "link",
          "icon": "dashboard",
          "tooltip": "View high-level service overview"
        }
      ]
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-infrastructure
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
    app.kubernetes.io/part-of: otterworks-observability
  annotations:
    grafana_folder: OtterWorks
data:
  infrastructure.json: |
    {
      "id": null,
      "uid": "otterworks-infrastructure",
      "title": "OtterWorks Infrastructure",
      "description": "Infrastructure monitoring: pod status, node utilization, network traffic, database connections, and queue depths.",
      "tags": [
        "otterworks",
        "infrastructure"
      ],
      "timezone": "utc",
      "editable": true,
      "graphTooltip": 1,
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "Prometheus",
              "value": "Prometheus"
            }
          }
        ]
      },
      "panels": [
        {
          "title": "Kubernetes Pods",
          "type": "row",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "collapsed": false
        },
        {
          "title": "Pod Status by Service",
          "type": "state-timeline",
          "gridPos": {
            "h": 6,
            "w": 24,
            "x": 0,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "options": {
                    "1": {
                      "text": "Running",
                      "color": "green"
                    }
                  },
                  "type": "value"
                },
                {
                  "options": {
                    "0": {
                      "text": "Not Ready",
                      "color": "red"
                    }
                  },
                  "type": "value"
                }
              ]
            }
          },
          "targets": [
            {
              "expr": "kube_pod_status_ready{namespace=\"otterworks\", condition=\"true\"}",
              "legendFormat": "{{ pod }}"
            }
          ]
        },
        {
          "title": "Pods Running",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "steps": [
                  {
                    "color": "red",
                    "value": null
                  },
                  {
                    "color": "green",
                    "value": 10
                  }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "count(kube_pod_status_phase{namespace=\"otterworks\", phase=\"Running\"} == 1)",
              "legendFormat": "running"
            }
          ]
        },
        {
          "title": "Pods Pending",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 3
                  }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "count(kube_pod_status_phase{namespace=\"otterworks\", phase=\"Pending\"} == 1) OR on() vector(0)",
              "legendFormat": "pending"
            }
          ]
        },
        {
          "title": "Pod Restarts (1h)",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 12,
            "y": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "yellow",
                    "value": 1
                  },
                  {
                    "color": "red",
                    "value": 5
                  }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "sum(increase(kube_pod_container_status_restarts_total{namespace=\"otterworks\"}[1h]))",
              "legendFormat": "restarts"
            }
          ]
        },
        {
          "title": "OOMKilled Events (24h)",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 18,
            "y": 7
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "sum(increase(kube_pod_container_status_last_terminated_reason{namespace=\"otterworks\", reason=\"OOMKilled\"}[24h])) OR on() vector(0)",
              "legendFormat": "OOMKilled"
            }
          ]
        },
        {
          "title": "Node Resources",
          "type": "row",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 11
          },
          "collapsed": false
        },
        {
          "title": "Node CPU Utilization",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 12
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "max": 1
            }
          },
          "targets": [
            {
              "expr": "1 - avg by (instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m]))",
              "legendFormat": "{{ instance }}"
            }
          ]
        },
        {
          "title": "Node Memory Utilization",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 12
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "max": 1
            }
          },
          "targets": [
            {
              "expr": "1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)",
              "legendFormat": "{{ instance }}"
            }
          ]
        },
        {
          "title": "Node Disk Usage",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 20
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "max": 1
            }
          },
          "targets": [
            {
              "expr": "1 - (node_filesystem_avail_bytes{mountpoint=\"/\"} / node_filesystem_size_bytes{mountpoint=\"/\"})",
              "legendFormat": "{{ instance }}"
            }
          ]
        },
        {
          "title": "Node Network I/O",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 20
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps"
            }
          },
          "targets": [
            {
              "expr": "sum by (instance) (rate(node_network_receive_bytes_total{device!=\"lo\"}[5m]))",
              "legendFormat": "{{ instance }} rx"
            },
            {
              "expr": "sum by (instance) (rate(node_network_transmit_bytes_total{device!=\"lo\"}[5m]))",
              "legendFormat": "{{ instance }} tx"
            }
          ]
        },
        {
          "title": "Database & Cache",
          "type": "row",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 28
          },
          "collapsed": false
        },
        {
          "title": "PostgreSQL Active Connections",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 29
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "pg_stat_activity_count{datname=\"otterworks\"}",
              "legendFormat": "{{ state }}"
            }
          ]
        },
        {
          "title": "Redis Memory Usage",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 29
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            }
          },
          "targets": [
            {
              "expr": "redis_memory_used_bytes",
              "legendFormat": "used"
            },
            {
              "expr": "redis_memory_max_bytes",
              "legendFormat": "max"
            }
          ]
        },
        {
          "title": "AWS Queues & Storage",
          "type": "row",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 37
          },
          "collapsed": false
        },
        {
          "title": "SQS Queue Depth",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 38
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "aws_sqs_approximate_number_of_messages_visible",
              "legendFormat": "{{ queue_name }}"
            }
          ]
        },
        {
          "title": "DynamoDB Consumed Capacity",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 38
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "targets": [
            {
              "expr": "sum by (table_name, operation) (rate(aws_dynamodb_consumed_read_capacity_total[5m]))",
              "legendFormat": "{{ table_name }} {{ operation }} read"
            },
            {
              "expr": "sum by (table_name, operation) (rate(aws_dynamodb_consumed_write_capacity_total[5m]))",
              "legendFormat": "{{ table_name }} {{ operation }} write"
            }
          ]
        },
        {
          "title": "Network Traffic",
          "type": "row",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 46
          },
          "collapsed": false
        },
        {
          "title": "Ingress Request Rate",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 47
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            }
          },
          "targets": [
            {
              "expr": "sum by (ingress) (rate(nginx_ingress_controller_requests[5m]))",
              "legendFormat": "{{ ingress }}"
            }
          ]
        },
        {
          "title": "Ingress Bandwidth",
          "type": "timeseries",
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 47
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "Bps"
            }
          },
          "targets": [
            {
              "expr": "sum by (ingress) (rate(nginx_ingress_controller_request_size_sum[5m]))",
              "legendFormat": "{{ ingress }} request"
            },
            {
              "expr": "sum by (ingress) (rate(nginx_ingress_controller_response_size_sum[5m]))",
              "legendFormat": "{{ ingress }} response"
            }
          ]
        }
      ],
      "time": {
        "from": "now-6h",
        "to": "now"
      },
      "refresh": "30s"
    }
