    {
      "id": null,
      "uid": "otterworks-chaos-scenarios",
      "title": "OtterWorks Chaos Scenarios",
      "description": "Real-time monitoring of chaos engineering scenarios - trigger from admin dashboard and observe failures here",
      "tags": [
        "otterworks",
        "chaos",
        "demo"
      ],
      "timezone": "utc",
      "editable": true,
      "graphTooltip": 1,
      "refresh": "5s",
      "time": {
        "from": "now-15m",
        "to": "now"
      },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "current": {
              "text": "Prometheus",
              "value": "Prometheus"
            }
          }
        ]
      },
      "panels": [
        {
          "title": "Chaos Status",
          "type": "row",
          "gridPos": {
            "h": 1,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "collapsed": false
        },
        {
          "title": "Search Service Chaos Active",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 0,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "options": {
                    "0": {
                      "text": "INACTIVE",
                      "color": "green"
                    }
                  },
                  "type": "value"
                },
                {
                  "options": {
                    "1": {
                      "text": "ACTIVE",
                      "color": "red"
                    }
                  },
                  "type": "value"
                }
              ],
              "thresholds": {
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "sum(rate(search_service_requests_total{status=~\"5..\"}[1m])) / sum(rate(search_service_requests_total[1m])) > 0.05",
              "legendFormat": "Chaos Active"
            }
          ],
          "description": "Search service chaos active when error rate >5%"
        },
        {
          "title": "File Service Chaos Active",
          "type": "stat",
          "gridPos": {
            "h": 4,
            "w": 6,
            "x": 6,
            "y": 1
          },
          "datasource": {
            "type": "prometheus",
            "uid": "${datasource}"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "options": {
                    "0": {
                      "text": "INACTIVE",
                      "color": "green"
                    }
                  },
                  "type": "value"
                },
                {
                  "options": {
                    "1": {
                      "text": "ACTIVE",
                      "color": "red"
                    }
                  },
                  "type": "value"
                }
              ],
              "thresholds": {
                "steps": [
                  {
                    "color": "green",
                    "value": null
                  },
                  {
                    "color": "red",
                    "value": 1
                  }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{path=~\"/api/v1/files.*\",status=~\"5..\"}[1m])) / sum(rate(http_requests_total{path=~\"/api/v1/files.*\"}[1m])) > 0.10",
              "legendFormat": "Chaos Active"
            }
          ],
          "description": "File service chaos active when error rate >10%"
