# Local kind validation: tiny footprint, every critical alert to the mock
# platform webhook (URL in the receivers Secret), no ingress.
prometheus:
  prometheusSpec:
    retention: 1d
    retentionSize: 1GB
    evaluationInterval: 15s
    scrapeInterval: 15s
    resources:
      requests: {cpu: 50m, memory: 256Mi}
alertmanager:
  config:
    route:
      receiver: "null"
      group_by: [namespace, alertname, affected_service]
      group_wait: 10s
      group_interval: 30s
      repeat_interval: 1h
      routes:
        - receiver: "null"
          matchers: ['alertname =~ "Watchdog|InfoInhibitor"']
        - receiver: platform-admin
          matchers: ['severity = "critical"']
    receivers:
      - name: "null"
      - name: platform-admin
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-otterworks-receivers/platform-webhook-url
            send_resolved: true
            http_config:
              authorization:
                credentials_file: /etc/alertmanager/secrets/alertmanager-otterworks-receivers/platform-webhook-token
kube-state-metrics:
  resources:
    requests: {cpu: 10m, memory: 32Mi}
