# otterworks-dev (shared EKS) overrides for kube-prometheus-stack.
# Receiver secrets live in the Secret alertmanager-otterworks-receivers, created by
# install-observability.sh from env vars (keys: platform-webhook-url,
# platform-webhook-token, slack-webhook-url). Receivers whose key is empty still
# load; deliveries to them just fail and show up in alertmanager_notifications_failed_total.
alertmanager:
  config:
    route:
      receiver: "null"
      group_by: [namespace, alertname, affected_service]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: "null"
          matchers: ['alertname =~ "Watchdog|InfoInhibitor"']
        # Tenant routes from AlertmanagerConfig CRs are prepended by the operator
        # (with continue: true), so these platform receivers also see tenant alerts.
        - receiver: platform-admin
          matchers: ['severity = "critical"']
          continue: true
        - receiver: slack
          matchers: ['severity = "critical"']
    receivers:
      - name: "null"
      - name: platform-admin
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-otterworks-receivers/platform-webhook-url
            send_resolved: true
            http_config:
              authorization:
                credentials_file: /etc/alertmanager/secrets/alertmanager-otterworks-receivers/platform-webhook-token
      - name: slack
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-otterworks-receivers/slack-webhook-url
            channel: "#otterworks-alerts"
            send_resolved: true
            title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }} ({{ .CommonLabels.namespace }})'
            text: '{{ range .Alerts }}{{ .Annotations.summary }} -- {{ .Annotations.description }}{{ "\n" }}{{ end }}'
grafana:
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts: [grafana.otterworks.app]
  grafana.ini:
    server:
      root_url: https://grafana.otterworks.app
