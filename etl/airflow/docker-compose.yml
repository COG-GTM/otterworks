# Local Airflow runner for the OtterWorks ETL DAGs.
#
#   docker compose -f docker-compose.infra.yml up -d postgres localstack meilisearch   # repo root
#   cp etl/airflow/.env.example etl/airflow/.env   # fill in the __SET_ME__ values
#   docker compose -f etl/airflow/docker-compose.yml up -d --build
#   open http://localhost:8088
#
# Joins the infra stack's `otterworks-network` so connections can use the infra container
# names (otterworks-localstack, otterworks-postgres, otterworks-meilisearch).
name: otterworks-airflow

x-airflow: &airflow
  build: .
  image: otterworks-airflow:local
  user: "${AIRFLOW_UID:-50000}:0"
  env_file: .env
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@airflow-db/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL: "30"
    AIRFLOW__LOGGING__LOGGING_CONFIG_CLASS: log_config.LOGGING_CONFIG
    PYTHONPATH: /opt/airflow/config
    OTTERWORKS_SPARK_JOBS_DIR: /opt/airflow/spark/jobs
    OTTERWORKS_ETL_DATA_DIR: /opt/airflow/data
  volumes:
    - ./dags:/opt/airflow/dags:ro
    - ./config:/opt/airflow/config:ro
    - ../spark:/opt/airflow/spark:ro
    - airflow-logs:/opt/airflow/logs
    - airflow-data:/opt/airflow/data
  networks: [default, otterworks]
  depends_on:
    airflow-db:
      condition: service_healthy

services:
  airflow-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: airflow
    volumes:
      - airflow-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      retries: 10

  airflow-init:
    <<: *airflow
    entrypoint: /bin/bash
    command:
      - -c
      - >-
        airflow db migrate &&
        airflow users create --role Admin --username "$${AIRFLOW_ADMIN_USER}"
        --password "$${AIRFLOW_ADMIN_PASSWORD}" --firstname OtterWorks --lastname Admin
        --email admin@example.invalid || true
    restart: "no"

  airflow-webserver:
    <<: *airflow
    command: webserver
    ports:
      - "127.0.0.1:8088:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 15s
      retries: 10
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  airflow-db:
  airflow-logs:
  airflow-data:

networks:
  otterworks:
    external: true
    name: otterworks-network
