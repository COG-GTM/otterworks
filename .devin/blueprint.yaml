runs-on: default
# One-time setup (e.g., install system tools, global CLIs).
initialize: |
  docker compose -f docker-compose.infra.yml pull
  # Serialized with retries: parallel builds overwhelm Docker's embedded DNS (127.0.0.11)
  # and dependency fetches (e.g. cargo's static.crates.io) intermittently fail to resolve.
  # Exponential backoff capped at 480s (30/60/120/240/480/480/480s, ~31.5 min total):
  # registries like Maven Central also rate-limit with HTTP 429, and a 429 window can
  # take tens of minutes -- not seconds -- to clear.
  COMPOSE="docker compose -f docker-compose.infra.yml -f docker-compose.yml"
  for svc in $($COMPOSE config --services); do
    n=0
    until $COMPOSE build "$svc"; do
      n=$((n+1)); [ "$n" -ge 8 ] && { echo "build failed for $svc after $n attempts"; exit 1; }
      backoff=$((15 * (2 ** n))); [ "$backoff" -gt 480 ] && backoff=480
      echo "retrying build for $svc ($n) in ${backoff}s"; sleep "$backoff"
    done
  done

  # One JDK for everything: Capacitor 6 compiles at 17, as do report-service and
  # legacy-portal (Boot 3.2). Maven is not on the base image.
  sudo apt-get update && sudo apt-get install -y openjdk-17-jdk-headless maven
  echo "JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64" >> $ENVRC
  sudo usermod -aG kvm "$(whoami)" || true

  # Vite 8 requires Node >=20.19.
  export NVM_DIR="$HOME/.nvm"; . "$NVM_DIR/nvm.sh"; nvm install 22 && nvm alias default 22

  export ANDROID_HOME=$HOME/Android/Sdk
  mkdir -p $ANDROID_HOME/cmdline-tools
  # sdkmanager >=19 is required: API 37 ships only as minor-versioned packages
  # (platforms;android-37.0), declared in SDK repository XML v4. sdkmanager 12 understands v3
  # only; it installs the platform without complaining but records it under the old schema,
  # which AGP 8.13's SDK loader will not match to compileSdk 37 -- assembleDebug then dies with
  # "Failed to find target with hash string 'android-37'". Same package list installed with
  # sdkmanager 19 builds fine. Re-installed whenever the on-disk tools predate 19.
  SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
  SDKM_MAJOR=$("$SDKM" --version 2>/dev/null | grep -Eo '^[0-9]+' | head -n1)
  if [ "${SDKM_MAJOR:-0}" -lt 19 ]; then
    # Download and unpack fully before dropping the old tools, so a failed fetch leaves a
    # working cmdline-tools/latest behind instead of an empty SDK.
    curl -fsSL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip \
      && rm -rf /tmp/cmdtools && unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools \
      && rm -rf $ANDROID_HOME/cmdline-tools/latest \
      && mv /tmp/cmdtools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest \
      || { echo "failed to install Android cmdline-tools 19"; exit 1; }
  fi
  yes | $SDKM --licenses >/dev/null
  # Build against API 37, but emulate API 36: the android-37.0 image crash-loops SurfaceFlinger
  # here ("Assertion failed: !rcEnc->featureInfo()->hasReadColorBufferDma") on every software
  # renderer, since the microVM has no GPU. minSdk is 24, so the API 37 APK runs on API 36.
  # Retry + verify: a partially-failed sdkmanager run doesn't stop the script here, and
  # surfaces later at assembleDebug as a misleading "Failed to find target with hash string
  # 'android-37'" -- the same symptom the cmdline-tools version guard above addresses, so
  # both causes (stale tools, incomplete download) have to be ruled out here.
  sdk_complete() {
    # package.xml is written on install finalization; the payload artifact catches a
    # package whose metadata survived but whose payload is missing or zero-byte.
    sdk_broken=""
    for p in "platforms/android-37.0:android.jar" "build-tools/37.0.0:aapt2" \
             "platforms/android-36:android.jar" "platform-tools:adb" \
             "emulator:emulator" "system-images/android-36/google_apis/x86_64:system.img"; do
      d=${p%%:*}; f=${p##*:}
      [ -f "$ANDROID_HOME/$d/package.xml" ] && [ -s "$ANDROID_HOME/$d/$f" ] \
        || { echo "SDK package $d missing or incomplete"; sdk_broken="$sdk_broken $d"; }
    done
    [ -z "$sdk_broken" ]
  }
  n=0
  while :; do
    yes | $SDKM "platform-tools" "emulator" "platforms;android-37.0" "build-tools;37.0.0" \
          "platforms;android-36" "system-images;android-36;google_apis;x86_64"
    sdkm_rc=$?
    # Verification is authoritative: if all packages are present, proceed even when
    # sdkmanager exited non-zero for some unrelated sub-step; if any is broken, repair
    # it on the very next attempt regardless of sdkmanager's exit code.
    if sdk_complete; then
      [ "$sdkm_rc" -eq 0 ] || echo "sdkmanager exited $sdkm_rc but all required packages verified; continuing"
      break
    fi
    # sdkmanager trusts package.xml, so a stale one would make a retry (or a later re-run of
    # this script) skip the package as installed -- always drop broken ones.
    for d in $sdk_broken; do rm -rf "$ANDROID_HOME/$d"; done
    n=$((n+1)); [ "$n" -ge 4 ] && { echo "sdkmanager install failed after $n attempts"; exit 1; }
    backoff=$((15 * (2 ** n)))
    echo "retrying sdkmanager install ($n) in ${backoff}s"; sleep "$backoff"
  done
  echo "no" | $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager create avd -n otter -k "system-images;android-36;google_apis;x86_64" -d pixel_6 --force
  # Shrink the display to conserve GPU/RAM in the microVM.
  AVD_CFG=$HOME/.android/avd/otter.avd/config.ini
  sed -i -E 's|^hw.lcd.width *=.*|hw.lcd.width = 720|; s|^hw.lcd.height *=.*|hw.lcd.height = 1600|; s|^hw.lcd.density *=.*|hw.lcd.density = 320|; s|^showDeviceFrame *=.*|showDeviceFrame = no|' "$AVD_CFG"
  grep -q '^skin.name' "$AVD_CFG" || echo 'skin.name = 720x1600' >> "$AVD_CFG"
  grep -q '^skin.path' "$AVD_CFG" || echo 'skin.path = _no_skin' >> "$AVD_CFG"
  echo "ANDROID_HOME=$HOME/Android/Sdk" >> $ENVRC
  echo "ANDROID_SDK_ROOT=$HOME/Android/Sdk" >> $ENVRC
  echo 'PATH=$HOME/Android/Sdk/platform-tools:$HOME/Android/Sdk/emulator:$HOME/Android/Sdk/cmdline-tools/latest/bin:$PATH' >> $ENVRC

  # The wrapper jar is gitignored and version-specific, so generate it in a scratch project.
  # Running `gradle wrapper` in the android project would configure Capacitor modules whose
  # files only exist after `npx cap sync`, which hasn't run yet.
  curl -sL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
  unzip -q -o /tmp/gradle.zip -d $HOME/gradle-dist
  mkdir -p /tmp/gradle-wrapper-gen && touch /tmp/gradle-wrapper-gen/settings.gradle
  (cd /tmp/gradle-wrapper-gen && $HOME/gradle-dist/gradle-8.14.3/bin/gradle wrapper --gradle-version 8.14.3)
  cp /tmp/gradle-wrapper-gen/gradle/wrapper/gradle-wrapper.jar \
     frontend/client-app/mobile/android/gradle/wrapper/gradle-wrapper.jar

  # repo.maven.apache.org rate-limits this box's egress IP with HTTP 429, which fails the
  # Android build the same way it failed the JVM service images. Reuse the init script those
  # Dockerfiles already carry, installed globally so snapshot warm-up and later sessions
  # (`make dev-android`) both prefer Google's Maven Central mirror.
  mkdir -p $HOME/.gradle/init.d
  cp services/auth-service/gradle-init.gradle $HOME/.gradle/init.d/maven-central-mirror.gradle

  # Warm the Gradle cache so runtime `make dev-android` builds are incremental.
  export ANDROID_HOME=$HOME/Android/Sdk ANDROID_SDK_ROOT=$HOME/Android/Sdk
  export PATH=$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
  # JAVA_HOME is only written to $ENVRC (for later sessions), so set it for assembleDebug.
  export JAVA_HOME=/usr/lib/jvm/java-17-openjdk-amd64
  nvm use default
  # Best-effort, like the Maven warm-ups below: a cold Gradle cache only makes the first
  # runtime `make dev-android` slow, whereas failing here aborts initialize and skips the
  # RetailCo seeding that every session actually depends on.
  android_warm_up() {
    (cd frontend/client-app && npm install && npm install --no-save @rolldown/binding-linux-x64-gnu@1.1.5 \
       && npm run build && npx cap sync android) || return 1
    (cd frontend/client-app/mobile/android && ./gradlew --no-daemon assembleDebug) || return 1
  }
  # tee, not `||`: a swallowed failure still has to be diagnosable from the snapshot log,
  # and the pipeline's own status is tee's, so read PIPESTATUS.
  android_warm_up 2>&1 | tee /tmp/android-warm-up.log
  warm_up_rc=${PIPESTATUS[0]}
  if [ "$warm_up_rc" -ne 0 ]; then
    echo "WARN: Android warm-up failed (exit $warm_up_rc); the first runtime build will be cold."
    echo "----- last 20 lines of /tmp/android-warm-up.log -----"
    tail -n 20 /tmp/android-warm-up.log
  fi

  # Save a "clean" snapshot so runtime launches resume instead of cold-booting. Best-effort:
  # if the emulator can't boot at build time (e.g. no /dev/kvm) runtime just cold-boots.
  sudo chmod 666 /dev/kvm || true
  emulator -avd otter -no-window -no-audio -no-snapshot -gpu swiftshader_indirect &
  EMU_PID=$!
  if timeout 120 adb wait-for-device \
     && timeout 240 bash -c 'until [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" = 1 ]; do sleep 3; done'; then
    adb shell settings put global window_animation_scale 0 || true
    adb shell settings put global transition_animation_scale 0 || true
    adb shell settings put global animator_duration_scale 0 || true
    adb emu avd snapshot save clean || true
    adb emu kill || true
  else
    echo "WARN: emulator did not boot at build time; skipping snapshot warm-up (runtime will cold-boot)."
  fi
  kill $EMU_PID 2>/dev/null || true
  wait $EMU_PID 2>/dev/null || true

  # Warm ~/.m2 so the Maven services resolve from cache instead of downloading Boot's tree.
  (cd services/report-service && mvn -B -q dependency:go-offline) || echo "WARN: report-service dependency warm-up failed."
  (cd services/legacy-portal && ./mvnw -B -q dependency:go-offline) || echo "WARN: legacy-portal dependency warm-up failed."

  # Seed the "RetailCo enterprise drive" (~2,445 files / 15 departments / 60 docs) through the
  # gateway so a session only runs `make up` to come up data-rich. Postgres, DynamoDB and
  # MeiliSearch land in docker volumes that persist into the snapshot. Idempotent.
  COMPOSE="docker compose -f docker-compose.infra.yml -f docker-compose.yml"
  # Start from clean volumes so Flyway migrations apply consistently at this revision.
  $COMPOSE down -v || true
  docker compose -f docker-compose.infra.yml up -d
  for i in $(seq 1 60); do docker exec otterworks-postgres pg_isready -q 2>/dev/null && break; sleep 2; done
  # auth-service must win the shared Flyway history race (several JVM services migrate version 1
  # into otterworks/public.flyway_schema_history; whichever runs first wins) since seeding logs in.
  $COMPOSE up -d --build auth-service
  for i in $(seq 1 90); do [ "$(docker inspect -f '{{.State.Health.Status}}' otterworks-auth-service 2>/dev/null)" = healthy ] && break; sleep 2; done
  $COMPOSE up -d --build
  for i in $(seq 1 120); do
    code=$(curl -s -o /dev/null -w '%{http_code}' -m 5 -X POST http://localhost:8080/api/v1/auth/login \
      -H 'Content-Type: application/json' -d '{"email":"probe@otterworks.local","password":"x"}' || true)
    [ "$code" != "000" ] && [ "$code" != "502" ] && [ "$code" != "503" ] && break
    sleep 2
  done
  python3 -m venv /tmp/retail-seed-venv
  /tmp/retail-seed-venv/bin/pip install -q -r testdata/generated/retail-drive/requirements.txt
  /tmp/retail-seed-venv/bin/python testdata/generated/retail-drive/generate_drive.py \
    --gateway http://localhost:8080 \
    --email "$DRIVE_EMAIL" --password "$DRIVE_PASSWORD" \
    --departments all --scale 1.0 --workers 6 --register

  # admin-service's Dockerfile runs db:migrate but never db:seed, leaving every admin-dashboard
  # screen empty. Best-effort: a seed failure must not sink the build.
  for i in $(seq 1 90); do [ "$(docker inspect -f '{{.State.Health.Status}}' otterworks-admin-service 2>/dev/null)" = healthy ] && break; sleep 2; done
  docker exec otterworks-admin-service bundle exec rails db:seed || echo "WARN: admin-service db:seed failed; admin dashboard will show empty tables."

  # LocalStack community does not persist S3, so bake the objects in for localstack-restore.sh.
  docker exec otterworks-localstack sh -lc \
    'for b in otterworks-files otterworks-data-lake otterworks-audit-archive; do \
       d=/var/lib/localstack/seed-s3/$b; mkdir -p "$d"; awslocal s3 sync "s3://$b" "$d"; \
     done'
  # Remove containers but KEEP the seeded volumes so they are captured in the snapshot.
  $COMPOSE down

  # --- Native per-service toolchains (mirrors the CI matrix in .github/workflows/ci.yml) ---
  # Needed for per-service builds, tests and lints outside Docker. Only the pieces the base
  # image lacks are installed; sbt, cargo, poetry and uv already ship with it.
  # Go 1.22 + golangci-lint (api-gateway)
  curl -sfLo /tmp/go.tar.gz https://go.dev/dl/go1.22.5.linux-amd64.tar.gz
  sudo rm -rf /usr/local/go && sudo tar -C /usr/local -xzf /tmp/go.tar.gz && rm /tmp/go.tar.gz
  echo 'PATH=/usr/local/go/bin:$HOME/go/bin:$PATH' >> $ENVRC
  curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $HOME/go/bin v1.59.1
  # JDK 8 + Maven for report-service (Java 8 source/target); JDK 21 above covers Gradle/sbt services.
  sudo apt-get install -y openjdk-8-jdk-headless maven
  # Gradle 8.6 on PATH, plus the gitignored wrapper jars the two JVM services are missing
  curl -sfLo /tmp/gradle-8.6.zip https://services.gradle.org/distributions/gradle-8.6-bin.zip
  unzip -q -o /tmp/gradle-8.6.zip -d $HOME && rm /tmp/gradle-8.6.zip
  echo 'PATH=$HOME/gradle-8.6/bin:$PATH' >> $ENVRC
  for svc in auth-service notification-service; do
    (cd services/$svc && JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64 $HOME/gradle-8.6/bin/gradle wrapper --gradle-version 8.6 --no-daemon)
  done
  # .NET 8 (audit-service)
  curl -sfLo /tmp/dotnet-install.sh https://dot.net/v1/dotnet-install.sh && chmod +x /tmp/dotnet-install.sh
  /tmp/dotnet-install.sh --channel 8.0 --install-dir $HOME/.dotnet && rm /tmp/dotnet-install.sh
  echo 'DOTNET_ROOT=$HOME/.dotnet' >> $ENVRC
  echo 'PATH=$HOME/.dotnet:$PATH' >> $ENVRC
  # Ruby 3.3.9 via rbenv (admin-service). 3.3.0 cannot parse the pinned connection_pool 3.0.2.
  sudo apt-get install -y libssl-dev libreadline-dev zlib1g-dev autoconf bison libyaml-dev libffi-dev
  [ -d "$HOME/.rbenv" ] || git clone https://github.com/rbenv/rbenv.git $HOME/.rbenv
  [ -d "$HOME/.rbenv/plugins/ruby-build" ] || git clone https://github.com/rbenv/ruby-build.git $HOME/.rbenv/plugins/ruby-build
  export PATH="$HOME/.rbenv/bin:$PATH" && eval "$(rbenv init -)"
  rbenv install -s 3.3.9 && rbenv global 3.3.9
  gem install bundler -v 2.5.9 --no-document && gem install bundler-audit --no-document
  echo 'PATH=$HOME/.rbenv/bin:$HOME/.rbenv/shims:$PATH' >> $ENVRC
  # Python 3.12 (document-service pins ^3.12; the base image ships 3.10) + linters/auditors
  uv python install 3.12
  uv tool install ruff && uv tool install pip-audit
  # trivy for make security-scan. terraform/kubectl/helm/aws-cli v2 come from the org-wide
  # blueprint (pinned to demo-platform/runner/Dockerfile) - do not shadow them here.
  mkdir -p $HOME/.local/bin
  curl -sfLo /tmp/trivy.tgz https://github.com/aquasecurity/trivy/releases/download/v0.72.0/trivy_0.72.0_Linux-64bit.tar.gz
  tar -xzf /tmp/trivy.tgz -C /tmp trivy && install -m755 /tmp/trivy $HOME/.local/bin/trivy && rm -f /tmp/trivy.tgz /tmp/trivy
  echo 'PATH=$HOME/.local/bin:$PATH' >> $ENVRC
# Install project dependencies (runs during builds, surfaced to agent at session start).
maintenance: |
  # file-service's Cargo.lock needs a newer Cargo than the baked-in 1.83 (edition2024).
  rustup update stable >/dev/null 2>&1 || true
  export NVM_DIR="$HOME/.nvm"; . "$NVM_DIR/nvm.sh"; nvm use default >/dev/null
  export PATH="$HOME/.rbenv/bin:$HOME/.rbenv/shims:$HOME/.dotnet:/usr/local/go/bin:$PATH"
  # The rolldown native binding is explicit: an npm optional-deps bug omits it and Vite fails.
  (cd frontend/client-app && npm install && npm install --no-save @rolldown/binding-linux-x64-gnu@1.1.5)
  (cd frontend/client-app/desktop && npm install)
  (cd frontend/admin-dashboard && npm install)
  (cd services/collab-service && npm install)
  # document-service pins python ^3.12, so point poetry at the uv-managed interpreter.
  (cd services/document-service && poetry env use "$(uv python find 3.12)" && poetry install)
  (cd services/search-service && uv venv --python 3.12 .venv && uv pip install --python .venv/bin/python -r requirements-dev.txt)
  (cd services/admin-service && bundle install)
  (cd services/api-gateway && go mod download)
  # Black-box API flow tests (make test-api-flows resolves UV_PROJECT_ENVIRONMENT=.venv)
  uv venv --python 3.12 .venv && uv pip install --python .venv/bin/python -r tests/api/requirements.txt
knowledge:
  - name: run backend + web
    contents: |
      make infra-up && make up   # web :3000, admin :4200, gateway :8080
  - name: seeded demo data (web app)
    contents: |
      The web app (:3000) is pre-seeded with the "RetailCo enterprise drive": ~2,445 files
      across 15 department folders + 60 rich-text documents, owned by the synthetic account
      in the DRIVE_EMAIL / DRIVE_PASSWORD secrets. To re-seed a fresh stack:
        python3 -m venv /tmp/seed && /tmp/seed/bin/pip install -r testdata/generated/retail-drive/requirements.txt
        /tmp/seed/bin/python testdata/generated/retail-drive/generate_drive.py \
          --gateway http://localhost:8080 --email "$DRIVE_EMAIL" \
          --password "$DRIVE_PASSWORD" --departments all --scale 1.0 --register
  - name: run admin dashboard
    contents: |
      `make up` serves the Angular dashboard at http://localhost:4200 from the prebuilt nginx
      container - no dev server needed. Login is a CLIENT-SIDE MOCK
      (frontend/admin-dashboard/src/app/core/services/auth.service.ts): any email + any
      non-empty password returns a hardcoded admin JWT, so the web-app credentials are not
      used here. Data comes from admin-service's tables, seeded at init. To re-seed:
        docker exec otterworks-admin-service bundle exec rails db:seed
      `make dev-admin` (HMR) works too: its node_modules are installed during maintenance.
  - name: run android app
    contents: |
      # Free resources before launching the emulator (virtualized microVM).
      pkill -f chrome 2>/dev/null || true
      sudo systemctl stop snapd unattended-upgrades cron 2>/dev/null || true
      sync; echo 3 | sudo tee /proc/sys/vm/drop_caches >/dev/null
      sudo chmod 666 /dev/kvm    # perms reset each boot
      # Resumes the "clean" snapshot; -no-snapshot-save keeps it pristine.
      DISPLAY=:0 emulator -avd otter -no-audio -gpu swiftshader_indirect -snapshot clean -no-snapshot-save &
      adb wait-for-device
      export NVM_DIR="$HOME/.nvm"; . "$NVM_DIR/nvm.sh"; nvm use default >/dev/null
      # `make dev-android` builds the web bundle and syncs, but its final `npx cap run
      # android` prompts "Please choose a target device" and aborts (exit 0, nothing
      # deployed) when stdin is not a TTY. There is no ANDROID_TARGET override in the
      # Makefile, so deploy explicitly afterwards (list ids with `adb devices`):
      make dev-android
      (cd frontend/client-app && npx cap run android --target emulator-5554 --no-sync)
      # Dismiss the "Nested virtualization" dialog on first boot or it blocks GUI interaction.
      # The app calls the gateway at http://10.0.2.2:8080/api/v1, so the backend must be up
      # (`make dev-backend`, which the make target already does).
      # Login fails with "Invalid email or password" if the Postgres volume came up empty -
      # check `docker exec otterworks-postgres psql -U otterworks -d otterworks -c 'select
      # count(*) from users;'` and re-seed per the "seeded demo data" entry (~90s).
  - name: run electron desktop app
    contents: |
      DISPLAY=:0 make dev-electron
      # Embedded server on :34117 proxies /api/v1 to the gateway; run with Node 22.
  - name: test
    contents: |
      # Per-service, all verified natively. `make test` itself fails: it cd's into
      # frontend/web-app, which no longer exists (the web frontend is frontend/client-app).
      (cd services/api-gateway && go test ./...)
      (cd services/auth-service && ./gradlew check --no-daemon)
      (cd services/notification-service && ./gradlew check --no-daemon)
      (cd services/analytics-service && sbt -batch test)
      (cd services/file-service && cargo test)
      (cd services/document-service && poetry run pytest)
      (cd services/search-service && .venv/bin/python -m pytest)
      (cd services/collab-service && npm test)
      (cd services/audit-service && dotnet test)
      (cd frontend/client-app && npm test)
      (cd services/report-service && JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64 mvn test -B)
      # admin-service specs need Postgres (make infra-up) and the compose credentials:
      export DATABASE_HOST=127.0.0.1 DATABASE_PASSWORD=otterworks_dev RAILS_ENV=test
      (cd services/admin-service && bundle exec rails db:create db:schema:load && bundle exec rspec)
      make test-api-flows   # black-box flows; needs the whole stack up (make up)
  - name: lint
    contents: |
      # `make lint` has the same frontend/web-app breakage as `make test`; per-service:
      (cd services/api-gateway && golangci-lint run)
      (cd services/auth-service && ./gradlew spotlessCheck --no-daemon)
      (cd services/file-service && cargo clippy -- -D warnings)
      (cd services/document-service && poetry run ruff check .)
      (cd services/search-service && ruff check .)
      (cd services/collab-service && npm run lint)
      (cd frontend/client-app && npm run lint)
  - name: java versions
    contents: |
      JAVA_HOME defaults to JDK 21 (Capacitor/AGP need it) and the Gradle 8.6 / sbt services
      (auth, notification, analytics) build and test fine on it. report-service is the
      exception - Java 8 source/target - so run Maven with
      JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64.
  - name: security scan
    contents: |
      make security-scan   # trivy + npm audit + pip-audit + bundle-audit
      # trivy's Java scanner hits repo.maven.apache.org rate limits (HTTP 429) unless ~/.m2 is
      # already populated; run `mvn dependency:resolve` in services/report-service first.
  - name: infra / deploy tooling
    contents: |
      terraform, kubectl, helm and AWS CLI v2 come from the org-wide blueprint (in
      /usr/local/bin) and cover make tf-*, scripts/deploy-dev.sh, scripts/deploy-tenant.sh
      and demo-platform/. `terraform fmt -check -recursive` and `terraform init
      -backend=false && terraform validate` both pass in infrastructure/terraform.
      AWS credentials are not provisioned, so deploys need them supplied per session.
  - name: golden app policy
    contents: |
      main is the golden app and contains deliberately planted bugs (see AGENTS.md) - do not
      "fix" them. Known: services/admin-service/config/environments/production.rb crash-loops
      on boot by design. document-service also has 9 failing auth tests (401s) on main.
---
# Windows sessions for the Electron desktop shell. Windows runs blueprint commands in
# bash (Git Bash), the same as Linux, so this document must be bash - not PowerShell.
runs-on: windows
initialize: |
  export npm_config_audit=false npm_config_fund=false npm_config_loglevel=error

  # Prefer Node >=22. Vite 8 is happy on the image's 20.19, but electron@43 and its toolchain
  # (@electron/get, @electron/rebuild, node-abi) declare engines >=22.12 and spray EBADENGINE
  # warnings -- today only warnings, but a latent breakage. Best-effort and fully guarded: if no
  # package manager is present the existing Node is kept and the build continues unchanged.
  major=$(node -v 2>/dev/null | sed 's/^v//' | cut -d. -f1)
  if [ -n "$major" ] && [ "$major" -lt 22 ]; then
    if command -v winget >/dev/null 2>&1; then
      winget install --id OpenJS.NodeJS.LTS -e --silent --accept-source-agreements --accept-package-agreements || true
    elif command -v choco >/dev/null 2>&1; then
      choco install nodejs-lts -y --no-progress || true
    else
      echo "No winget/choco available; keeping Node $major (EBADENGINE warnings expected)."
    fi
  fi

  # Web client: deps + production bundle. The Electron shell serves frontend/client-app/dist.
  (cd frontend/client-app && npm ci && npm run build) || { echo "client-app setup failed"; exit 1; }

  # Electron desktop shell: deps + TypeScript build (src -> build).
  (cd frontend/client-app/desktop && npm ci && npm run build) || { echo "desktop setup failed"; exit 1; }

  # npm ci does NOT fetch the Electron binary (its download is deferred to first launch), so
  # pre-download it via Electron's own installer to keep the snapshot boot fast.
  (cd frontend/client-app/desktop && node node_modules/electron/install.js) || { echo "electron binary download failed"; exit 1; }
maintenance: |
  (cd frontend/client-app && npm install)
  (cd frontend/client-app/desktop && npm install)
knowledge:
  - name: run electron desktop app
    contents: |
      (cd frontend/client-app/desktop && npm start)   # builds then launches the Electron shell
      # Embedded server on :34117 proxies /api/v1 to a gateway; run with Node 22.
  - name: build web bundle
    contents: |
      (cd frontend/client-app && npm run build)   # Electron serves frontend/client-app/dist
