# https://docs.devin.ai/onboard-devin/environment-yaml
# Docker + Compose v2 preinstalled; app + mobile + desktop toolchains set up here.
initialize: |
  # Pre-pull infra images and pre-build all service/frontend images (layers persist; containers do not).
  docker compose -f docker-compose.infra.yml pull
  # Build one service at a time with retries. Building everything in parallel overwhelms
  # Docker's embedded DNS (127.0.0.11), so dependency fetches (e.g. cargo's static.crates.io)
  # intermittently fail to resolve; serializing avoids the DNS storm and the retry covers blips.
  COMPOSE="docker compose -f docker-compose.infra.yml -f docker-compose.yml"
  for svc in $($COMPOSE config --services); do
    n=0
    until $COMPOSE build "$svc"; do
      n=$((n+1)); [ "$n" -ge 3 ] && { echo "build failed for $svc after $n attempts"; exit 1; }
      echo "retrying build for $svc ($n)"; sleep 10
    done
  done

  # --- Mobile (Capacitor Android app at frontend/client-app/mobile/android) ---
  # JDK 21 (Capacitor 8 / AGP require it)
  sudo apt-get update && sudo apt-get install -y openjdk-21-jdk-headless
  echo "JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64" >> $ENVRC
  sudo usermod -aG kvm "$(whoami)" || true   # emulator hardware acceleration (/dev/kvm)

  # Node 22 (Vite 8 requires Node >=20.19)
  export NVM_DIR="$HOME/.nvm"; . "$NVM_DIR/nvm.sh"; nvm install 22 && nvm alias default 22

  # Android SDK command-line tools + packages (compileSdk 36)
  export ANDROID_HOME=$HOME/Android/Sdk
  mkdir -p $ANDROID_HOME/cmdline-tools
  if [ ! -d "$ANDROID_HOME/cmdline-tools/latest" ]; then
    curl -sL -o /tmp/cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
    unzip -q -o /tmp/cmdtools.zip -d $ANDROID_HOME/cmdline-tools
    mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
  fi
  SDKM=$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager
  yes | $SDKM --licenses >/dev/null
  $SDKM "platform-tools" "emulator" "platforms;android-36" "build-tools;36.0.0" "system-images;android-36;google_apis;x86_64"
  echo "no" | $ANDROID_HOME/cmdline-tools/latest/bin/avdmanager create avd -n otter -k "system-images;android-36;google_apis;x86_64" -d pixel_6 --force
  echo "ANDROID_HOME=$HOME/Android/Sdk" >> $ENVRC
  echo "ANDROID_SDK_ROOT=$HOME/Android/Sdk" >> $ENVRC
  echo 'PATH=$HOME/Android/Sdk/platform-tools:$HOME/Android/Sdk/emulator:$HOME/Android/Sdk/cmdline-tools/latest/bin:$PATH' >> $ENVRC

  # Gradle wrapper jar is gitignored. Generate it in a scratch project and copy the jar in.
  # (The jar is version-specific, not project-specific. Running `gradle wrapper` inside the
  #  android project would configure Capacitor modules whose files - e.g. cordova.variables.gradle -
  #  only exist after `npx cap sync`, which hasn't run yet, so we avoid touching that project here.)
  curl -sL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.14.3-bin.zip
  unzip -q -o /tmp/gradle.zip -d $HOME/gradle-dist
  mkdir -p /tmp/gradle-wrapper-gen && touch /tmp/gradle-wrapper-gen/settings.gradle
  (cd /tmp/gradle-wrapper-gen && $HOME/gradle-dist/gradle-8.14.3/bin/gradle wrapper --gradle-version 8.14.3)
  cp /tmp/gradle-wrapper-gen/gradle/wrapper/gradle-wrapper.jar \
     frontend/client-app/mobile/android/gradle/wrapper/gradle-wrapper.jar

  # --- Seed the golden "RetailCo enterprise drive" dataset --------------------
  # Bring the whole stack up transiently and populate a deep, browsable enterprise
  # drive (~2,445 files across 15 department folders + 60 rich-text docs) via the
  # public API gateway, all owned by one synthetic account
  # (email/password from the DRIVE_EMAIL / DRIVE_PASSWORD secrets). Postgres (documents), DynamoDB
  # (folders + file metadata, persisted via PERSISTENCE=1) and MeiliSearch land in
  # docker volumes that persist into the snapshot. LocalStack does NOT persist S3
  # objects, so we additionally bake the S3 objects into the localstack volume and
  # localstack-restore.sh re-hydrates them on boot. Net result: a session only runs
  # `make up` to come up data-rich. Idempotent + re-runnable.
  COMPOSE="docker compose -f docker-compose.infra.yml -f docker-compose.yml"
  # Start from clean volumes so Flyway migrations apply consistently at this revision.
  $COMPOSE down -v || true
  docker compose -f docker-compose.infra.yml up -d
  for i in $(seq 1 60); do docker exec otterworks-postgres pg_isready -q 2>/dev/null && break; sleep 2; done
  # Bring auth-service up FIRST so it wins the shared Flyway history race (several JVM
  # services migrate version 1 into otterworks/public.flyway_schema_history; whichever
  # runs first wins). Login is required to seed, so auth must win. Its history is then
  # baked into the postgres volume, making every future `make up` deterministic.
  $COMPOSE up -d --build auth-service
  for i in $(seq 1 90); do [ "$(docker inspect -f '{{.State.Health.Status}}' otterworks-auth-service 2>/dev/null)" = healthy ] && break; sleep 2; done
  $COMPOSE up -d --build
  # Wait for the auth path through the gateway to be live (auth-service boots slowest).
  for i in $(seq 1 120); do
    code=$(curl -s -o /dev/null -w '%{http_code}' -m 5 -X POST http://localhost:8080/api/v1/auth/login \
      -H 'Content-Type: application/json' -d '{"email":"probe@otterworks.local","password":"x"}' || true)
    [ "$code" != "000" ] && [ "$code" != "502" ] && [ "$code" != "503" ] && break
    sleep 2
  done
  python3 -m venv /tmp/retail-seed-venv
  /tmp/retail-seed-venv/bin/pip install -q -r testdata/generated/retail-drive/requirements.txt
  /tmp/retail-seed-venv/bin/python testdata/generated/retail-drive/generate_drive.py \
    --gateway http://localhost:8080 \
    --email "$DRIVE_EMAIL" --password "$DRIVE_PASSWORD" \
    --departments all --scale 1.0 --workers 6 --register
  # Bake seeded S3 objects into the localstack volume (LocalStack community does not
  # persist S3); localstack-restore.sh re-hydrates these buckets on the next boot.
  docker exec otterworks-localstack sh -lc \
    'for b in otterworks-files otterworks-data-lake otterworks-audit-archive; do \
       d=/var/lib/localstack/seed-s3/$b; mkdir -p "$d"; awslocal s3 sync "s3://$b" "$d"; \
     done'
  # Remove containers but KEEP the seeded volumes so they are captured in the snapshot.
  $COMPOSE down

  # --- Native per-service toolchains (mirrors the CI matrix in .github/workflows/ci.yml) ---
  # Needed for `make test` / `make lint` / `make security-scan` and per-service builds outside
  # Docker. Only the pieces the base image lacks are installed; sbt, cargo, poetry and uv ship with it.
  # Go 1.22 + golangci-lint (api-gateway)
  curl -sfLo /tmp/go.tar.gz https://go.dev/dl/go1.22.5.linux-amd64.tar.gz
  sudo rm -rf /usr/local/go && sudo tar -C /usr/local -xzf /tmp/go.tar.gz && rm /tmp/go.tar.gz
  echo 'PATH=/usr/local/go/bin:$HOME/go/bin:$PATH' >> $ENVRC
  curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $HOME/go/bin v1.59.1
  # The pinned Rust 1.83 predates edition2024, which file-service's dependencies require.
  rustup update stable
  # JDK 8 + Maven for report-service (Java 8 source/target); JDK 21 above covers Gradle/sbt services.
  sudo apt-get install -y openjdk-8-jdk-headless maven
  # Gradle 8.6 on PATH, plus the gitignored wrapper jars the two JVM services are missing
  curl -sfLo /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.6-bin.zip
  unzip -q -o /tmp/gradle.zip -d $HOME && rm /tmp/gradle.zip
  echo 'PATH=$HOME/gradle-8.6/bin:$PATH' >> $ENVRC
  for svc in auth-service notification-service; do
    (cd services/$svc && JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64 $HOME/gradle-8.6/bin/gradle wrapper --gradle-version 8.6 --no-daemon)
  done
  # .NET 8 (audit-service)
  curl -sfLo /tmp/dotnet-install.sh https://dot.net/v1/dotnet-install.sh && chmod +x /tmp/dotnet-install.sh
  /tmp/dotnet-install.sh --channel 8.0 --install-dir $HOME/.dotnet && rm /tmp/dotnet-install.sh
  echo 'DOTNET_ROOT=$HOME/.dotnet' >> $ENVRC
  echo 'PATH=$HOME/.dotnet:$PATH' >> $ENVRC
  # Ruby 3.3.9 via rbenv (admin-service). 3.3.0 cannot parse the pinned connection_pool 3.0.2.
  sudo apt-get install -y libssl-dev libreadline-dev zlib1g-dev autoconf bison libyaml-dev libffi-dev
  [ -d "$HOME/.rbenv" ] || git clone https://github.com/rbenv/rbenv.git $HOME/.rbenv
  [ -d "$HOME/.rbenv/plugins/ruby-build" ] || git clone https://github.com/rbenv/ruby-build.git $HOME/.rbenv/plugins/ruby-build
  export PATH="$HOME/.rbenv/bin:$PATH" && eval "$(rbenv init -)"
  rbenv install -s 3.3.9 && rbenv global 3.3.9
  gem install bundler -v 2.5.9 --no-document && gem install bundler-audit --no-document
  echo 'PATH=$HOME/.rbenv/bin:$HOME/.rbenv/shims:$PATH' >> $ENVRC
  # Python 3.12 (document-service pins ^3.12; the base image ships 3.10) + linters/auditors
  uv python install 3.12
  uv tool install ruff && uv tool install pip-audit
  # Infra tooling for make tf-*, scripts/deploy-*.sh and demo-platform (helm/k8s)
  mkdir -p $HOME/.local/bin
  curl -sfLo /tmp/terraform.zip https://releases.hashicorp.com/terraform/1.9.8/terraform_1.9.8_linux_amd64.zip
  unzip -oq /tmp/terraform.zip -d $HOME/.local/bin && rm /tmp/terraform.zip
  curl -sfLo /tmp/kubectl https://dl.k8s.io/release/v1.30.4/bin/linux/amd64/kubectl
  install -m755 /tmp/kubectl $HOME/.local/bin/kubectl && rm /tmp/kubectl
  curl -sfL https://get.helm.sh/helm-v3.15.4-linux-amd64.tar.gz -o /tmp/helm.tgz
  tar -xzf /tmp/helm.tgz -C /tmp && install -m755 /tmp/linux-amd64/helm $HOME/.local/bin/helm && rm -rf /tmp/helm.tgz /tmp/linux-amd64
  # AWS CLI v2 (base image only has v1) and trivy for make security-scan
  curl -sfLo /tmp/awscliv2.zip https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
  rm -rf /tmp/aws-cli-v2 && mkdir /tmp/aws-cli-v2 && unzip -q /tmp/awscliv2.zip -d /tmp/aws-cli-v2
  /tmp/aws-cli-v2/aws/install --install-dir $HOME/.local/aws-cli --bin-dir $HOME/.local/bin --update
  curl -sfLo /tmp/trivy.tgz https://github.com/aquasecurity/trivy/releases/download/v0.72.0/trivy_0.72.0_Linux-64bit.tar.gz
  tar -xzf /tmp/trivy.tgz -C /tmp trivy && install -m755 /tmp/trivy $HOME/.local/bin/trivy && rm -f /tmp/trivy.tgz /tmp/trivy
  echo 'PATH=$HOME/.local/bin:$PATH' >> $ENVRC
maintenance: |
  export NVM_DIR="$HOME/.nvm"; . "$NVM_DIR/nvm.sh"; nvm use default >/dev/null
  export PATH="$HOME/.rbenv/bin:$HOME/.rbenv/shims:$HOME/.dotnet:/usr/local/go/bin:$PATH"
  # Include the linux rolldown native binding (npm optional-deps bug omits it -> Vite build fails)
  (cd frontend/client-app && npm install && npm install --no-save @rolldown/binding-linux-x64-gnu@1.1.5)
  # Electron desktop app deps (downloads the Electron binary via postinstall under Node 22)
  (cd frontend/client-app/desktop && npm install)
  (cd frontend/admin-dashboard && npm install)
  (cd services/collab-service && npm install)
  # document-service pins python ^3.12, so point poetry at the uv-managed interpreter.
  (cd services/document-service && poetry env use "$(uv python find 3.12)" && poetry install)
  (cd services/search-service && uv venv --python 3.12 .venv && uv pip install --python .venv/bin/python -r requirements-dev.txt)
  (cd services/admin-service && bundle install)
  (cd services/api-gateway && go mod download)
  # Black-box API flow tests (make test-api-flows resolves UV_PROJECT_ENVIRONMENT=.venv)
  uv venv --python 3.12 .venv && uv pip install --python .venv/bin/python -r tests/api/requirements.txt
knowledge:
  - name: run backend + web
    contents: |
      make infra-up && make up   # web :3000, admin :4200, gateway :8080
  - name: seeded demo data (web app)
    contents: |
      The web app (:3000) comes pre-seeded with the "RetailCo enterprise drive":
      ~2,445 files across 15 department folders (nested 3-4 levels) + 60 rich-text
      documents, owned by one synthetic account. Log in at http://localhost:3000 as
      the account in the DRIVE_EMAIL / DRIVE_PASSWORD secrets. To (re)seed a fresh stack:
        python3 -m venv /tmp/seed && /tmp/seed/bin/pip install -r testdata/generated/retail-drive/requirements.txt
        /tmp/seed/bin/python testdata/generated/retail-drive/generate_drive.py \
          --gateway http://localhost:8080 --email "$DRIVE_EMAIL" \
          --password "$DRIVE_PASSWORD" --departments all --scale 1.0 --register
  - name: run android app
    contents: |
      sudo chmod 666 /dev/kvm    # /dev/kvm perms reset each boot
      emulator -avd otter -no-snapshot -no-audio -no-window -gpu swiftshader_indirect &
      adb wait-for-device
      make dev-android   # builds (with the correct collab port) + cap sync + cap run on the emulator
      # App calls the gateway at http://10.0.2.2:8080/api/v1 (debug build allows cleartext to 10.0.2.2).
  - name: run electron desktop app
    contents: |
      DISPLAY=:0 make dev-electron   # builds (with the correct collab port) + launches the Electron desktop app
      # Embedded server on :34117 proxies /api/v1 to the gateway; run with Node 22.
  - name: test
    contents: |
      # Per-service, all verified natively. `make test` itself fails: it cd's into
      # frontend/web-app, which no longer exists (the web frontend is frontend/client-app).
      (cd services/api-gateway && go test ./...)
      (cd services/auth-service && ./gradlew check --no-daemon)
      (cd services/notification-service && ./gradlew check --no-daemon)
      (cd services/analytics-service && sbt -batch test)
      (cd services/file-service && cargo test)
      (cd services/document-service && poetry run pytest)
      (cd services/search-service && .venv/bin/python -m pytest)
      (cd services/collab-service && npm test)
      (cd services/audit-service && dotnet test)
      (cd frontend/client-app && npm test)
      (cd services/report-service && JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64 mvn test -B)
      # admin-service specs need Postgres (make infra-up) and the compose credentials:
      export DATABASE_HOST=127.0.0.1 DATABASE_PASSWORD=otterworks_dev RAILS_ENV=test
      (cd services/admin-service && bundle exec rails db:create db:schema:load && bundle exec rspec)
      make test-api-flows   # black-box flows; needs the whole stack up (make up)
  - name: lint
    contents: |
      # `make lint` has the same frontend/web-app breakage as `make test`; per-service:
      (cd services/api-gateway && golangci-lint run)
      (cd services/auth-service && ./gradlew spotlessCheck --no-daemon)
      (cd services/file-service && cargo clippy -- -D warnings)
      (cd services/document-service && poetry run ruff check .)
      (cd services/search-service && ruff check .)
      (cd services/collab-service && npm run lint)
      (cd frontend/client-app && npm run lint)
  - name: java versions
    contents: |
      JAVA_HOME defaults to JDK 21 (Capacitor/AGP need it) and the Gradle 8.6 / sbt services
      (auth, notification, analytics) build and test fine on it. report-service is the
      exception - Java 8 source/target - so run Maven with
      JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64.
  - name: security scan
    contents: |
      make security-scan   # trivy + npm audit + pip-audit + bundle-audit
      # trivy's Java scanner hits repo.maven.apache.org rate limits (HTTP 429) unless ~/.m2 is
      # already populated; run `mvn dependency:resolve` in services/report-service first.
  - name: infra / deploy tooling
    contents: |
      terraform, kubectl, helm and AWS CLI v2 are installed for make tf-*,
      scripts/deploy-dev.sh, scripts/deploy-tenant.sh and demo-platform/.
      AWS credentials are not provisioned, so deploys need them supplied per session.
  - name: golden app policy
    contents: |
      main is the golden app and contains deliberately planted bugs (see AGENTS.md) - do not
      "fix" them. Known: services/admin-service/config/environments/production.rb crash-loops
      on boot by design. document-service currently has 9 failing auth tests (401s) on main.
