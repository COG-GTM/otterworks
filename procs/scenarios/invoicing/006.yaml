id: INVOICE-006
module: invoicing
description: Read the persisted lines for invoice 1.
entrypoint: billing.fn_invoice_lines
kind: function
inputs:
  - {name: invoice_id, type: uuid, value: 60000000-0000-0000-0000-000000000001}
fields:
  - {name: line_types, from: line_type, type: text, collect: true}
  - {name: amounts, from: amount, type: decimal, collect: true}
probes:
  - {id: line_values, query: "SELECT string_agg(line_no::text || ':' || amount::text, ',' ORDER BY line_no) FROM billing.invoice_lines WHERE invoice_id = '60000000-0000-0000-0000-000000000001'"}
rules: [INVOICE-006]
