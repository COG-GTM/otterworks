id: RATING-004
module: rating
description: Rate tenant 6 for 2026-02-01 through 2026-02-28 with 201 units.
entrypoint: billing.fn_usage_rating
kind: function
inputs:
  - {name: tenant_id, type: uuid, value: 00000000-0000-0000-0000-000000000006}
  - {name: period_start, type: date, value: 2026-02-01}
  - {name: period_end, type: date, value: 2026-02-28}
fields:
  - {name: overage_amount, from: overage_amount, type: decimal}
  - {name: first_tier_units, from: first_tier_units, type: integer}
probes:
  - {id: rating_values, query: "SELECT billable_units::text || ':' || overage_amount::text FROM billing.fn_usage_rating('00000000-0000-0000-0000-000000000006', '2026-02-01', '2026-02-28')"}
rules: [RATING-004]
