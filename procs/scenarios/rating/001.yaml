id: RATING-001
module: rating
description: Rate tenant 1 for 2026-02-01 through 2026-02-28 with 260 units.
entrypoint: billing.fn_usage_rating
kind: function
inputs:
  - {name: tenant_id, type: uuid, value: 00000000-0000-0000-0000-000000000001}
  - {name: period_start, type: date, value: 2026-02-01}
  - {name: period_end, type: date, value: 2026-02-28}
fields:
  - {name: used_units, from: used_units, type: integer}
  - {name: rollover_units, from: rollover_units, type: integer}
  - {name: billable_units, from: billable_units, type: integer}
probes:
  - {id: rating_values, query: "SELECT used_units::text || ':' || rollover_units::text || ':' || billable_units::text FROM billing.fn_usage_rating('00000000-0000-0000-0000-000000000001', '2026-02-01', '2026-02-28')"}
rules: [RATING-001]
