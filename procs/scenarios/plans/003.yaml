id: PLANS-003
module: plans
description: Read the entitlement for tenant 2 on 2026-02-28.
entrypoint: billing.fn_entitlement
kind: function
inputs:
  - {name: tenant_id, type: uuid, value: 00000000-0000-0000-0000-000000000002}
  - {name: as_of, type: date, value: 2026-02-28}
fields:
  - {name: plan_code, from: plan_code, type: text}
  - {name: subscription_status, from: subscription_status, type: text}
probes:
  - {id: entitlement_values, query: "SELECT plan_code || ':' || subscription_status FROM billing.fn_entitlement('00000000-0000-0000-0000-000000000002', '2026-02-28')"}
rules: [PLANS-003]
