modules:
  plans:
    status: extracted
    entrypoints:
      billing.fn_list_plans:
        method: GET
        path: /api/plans
        response:
          business_fields:
            codes: {json_path: "$[*].code", type: text, collect: true}
            fees: {json_path: "$[*].monthly_fee", type: decimal, collect: true}
      billing.fn_entitlement:
        method: GET
        path: /api/tenants/{tenant_id}/entitlement
        inputs:
          path:
            tenant_id: tenant_id
          query:
            "on": as_of
        response:
          business_fields:
            plan_code: {json_path: "$.plan_code", type: text}
            tier: {json_path: "$.tier", type: text}
            included_units: {json_path: "$.included_units", type: integer}
            subscription_status: {json_path: "$.subscription_status", type: text}
      billing.sp_change_plan:
        method: POST
        path: /api/tenants/{tenant_id}/plan-change
        inputs:
          path:
            tenant_id: tenant_id
          body:
            plan_id: plan_id
            effective_on: effective_on
        response:
          business_fields:
            subscriptions:
              json_path: "$.subscriptions"
              type: rows
          probes:
            subscription_rows:
              json_path: "$.subscriptions"
  rating:
    status: extracted
    entrypoints:
      billing.fn_usage_rating:
        method: GET
        path: /api/tenants/{tenant_id}/usage-rating
        inputs:
          path:
            tenant_id: tenant_id
          query:
            period_start: period_start
            period_end: period_end
        response:
          business_fields:
            used_units: {json_path: "$.used_units", type: integer}
            rollover_units: {json_path: "$.rollover_units", type: integer}
            billable_units: {json_path: "$.billable_units", type: integer}
            first_tier_units: {json_path: "$.first_tier_units", type: integer}
            second_tier_units: {json_path: "$.second_tier_units", type: integer}
            overage_amount: {json_path: "$.overage_amount", type: decimal}
      billing.fn_usage_summary:
        method: GET
        path: /api/tenants/{tenant_id}/usage-summary
        inputs:
          path:
            tenant_id: tenant_id
          query:
            period_start: period_start
            period_end: period_end
        response:
          business_fields:
            kinds: {json_path: "$[*].kind", type: text, collect: true}
            units: {json_path: "$[*].units", type: integer, collect: true}
      billing.sp_finalize_rating:
        method: POST
        path: /api/tenants/{tenant_id}/rating-periods
        inputs:
          path:
            tenant_id: tenant_id
          body:
            period_start: period_start
            period_end: period_end
        response:
          business_fields:
            used_units: {json_path: "$.result.used_units", type: integer}
            quota_units: {json_path: "$.result.quota_units", type: integer}
            rollover_units: {json_path: "$.result.rollover_units", type: integer}
            billable_units: {json_path: "$.result.billable_units", type: integer}
            overage_amount: {json_path: "$.result.overage_amount", type: decimal}
          probes:
            rating_result:
              json_path: "$.rating_results"
  invoicing:
    status: extracted
    entrypoints:
      billing.fn_invoice_preview:
        method: GET
        path: /api/tenants/{tenant_id}/invoice-preview
        inputs:
          path:
            tenant_id: tenant_id
          query:
            period_start: period_start
            period_end: period_end
        response:
          business_fields:
            line_numbers: {json_path: "$[*].line_no", type: integer, collect: true}
            line_types: {json_path: "$[*].line_type", type: text, collect: true}
            amounts: {json_path: "$[*].amount", type: decimal, collect: true}
            tax_amount: {json_path: "$[*].tax_amount", type: decimal, collect: true}
            totals: {json_path: "$[*].total", type: decimal, collect: true}
      billing.fn_invoice_lines:
        method: GET
        path: /api/invoices/{invoice_id}/lines
        inputs:
          path:
            invoice_id: invoice_id
        response:
          business_fields:
            line_types: {json_path: "$[*].line_type", type: text, collect: true}
            amounts: {json_path: "$[*].amount", type: decimal, collect: true}
      billing.sp_issue_invoice:
        method: POST
        path: /api/tenants/{tenant_id}/invoices
        inputs:
          path:
            tenant_id: tenant_id
          body:
            period_start: period_start
            period_end: period_end
        response:
          business_fields:
            status: {json_path: "$.invoice.status", type: text}
            tax: {json_path: "$.invoice.tax", type: decimal}
            total: {json_path: "$.invoice.total", type: decimal}
            credit_ids: {json_path: "$.credit_notes[*].id", type: text, collect: true}
            issued_on: {json_path: "$.credit_notes[*].issued_on", type: date, collect: true}
            remaining: {json_path: "$.credit_notes[*].remaining_amount", type: decimal, collect: true}
          probes:
            invoice_state:
              json_path: "$.invoices"
  dunning:
    status: extracted
    entrypoints:
      billing.fn_overdue_accounts:
        method: GET
        path: /api/dunning/overdue
        inputs:
          query:
            as_of: as_of
        response:
          business_fields:
            tenant_ids: {json_path: "$[*].tenant_id", type: uuid, collect: true}
            days_overdue: {json_path: "$[*].days_overdue", type: integer, collect: true}
      billing.sp_schedule_dunning:
        method: POST
        path: /api/dunning/schedule
        inputs:
          body:
            as_of: as_of
        response:
          business_fields:
            scheduled_for: {json_path: "$.scheduled_for", type: text}
            status: {json_path: "$.scheduled[0].status", type: text}
            attempt_no: {json_path: "$.scheduled[1].attempt_no", type: integer}
          probes:
            schedule_rows:
              json_path: "$.attempts"
      billing.sp_suspend_overdue:
        method: POST
        path: /api/dunning/suspend
        inputs:
          body:
            as_of: as_of
        response:
          business_fields:
            status: {json_path: "$.subscriptions[0].status", type: text}
            suspended_on: {json_path: "$.subscriptions[0].suspended_on", type: text}
            notification_kinds: {json_path: "$.suspension_notifications[*].kind", type: text, collect: true}
          probes:
            suspension_notifications:
              json_path: "$.suspension_notifications"
