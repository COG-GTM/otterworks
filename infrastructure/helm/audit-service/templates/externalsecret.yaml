{{- /*
  ExternalSecret: syncs this service's keys from AWS Secrets Manager / SSM
  Parameter Store into the Secret <release>-external-secrets (envFrom'd by the
  Deployment). Off unless externalSecrets.enabled. See docs/SECRETS.md.
*/ -}}
{{- $es := .Values.externalSecrets | default dict }}
{{- /* Keep only non-empty entries, so a map whose values are all "" (or nulled
  per tenant) renders nothing instead of a null field the CRD rejects. */ -}}
{{- $secrets := dict }}
{{- range $env, $key := $es.secrets }}{{ if $key }}{{ $_ := set $secrets $env $key }}{{ end }}{{ end }}
{{- $parameters := dict }}
{{- range $env, $key := $es.parameters }}{{ if $key }}{{ $_ := set $parameters $env $key }}{{ end }}{{ end }}
{{- $templates := dict }}
{{- range $env, $tpl := $es.templates }}{{ if $tpl }}{{ $_ := set $templates $env $tpl }}{{ end }}{{ end }}
{{- if and $es.enabled (or $secrets $parameters) }}
{{- $service := $es.service | default .Chart.Name }}
{{- $prefix := required "externalSecrets.keyPrefix is required (e.g. otterworks/dev)" $es.keyPrefix | trimAll "/" }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-external-secrets
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
spec:
  refreshInterval: {{ $es.refreshInterval | default "1h" | quote }}
  secretStoreRef:
    kind: {{ $es.secretStoreRef.kind | default "ClusterSecretStore" }}
    name: {{ $es.secretStoreRef.name }}
  target:
    name: {{ .Release.Name }}-external-secrets
    creationPolicy: Owner
    {{- with $templates }}
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        {{- range $env, $tpl := . }}
        {{ $env }}: {{ $tpl | quote }}
        {{- end }}
    {{- end }}
  data:
    {{- range $env, $key := $secrets }}
    - secretKey: {{ $env }}
      remoteRef:
        key: {{ printf "%s/%s/%s" $prefix $service $key }}
    {{- end }}
    {{- range $env, $key := $parameters }}
    - secretKey: {{ $env }}
      sourceRef:
        storeRef:
          kind: {{ $es.parameterStoreRef.kind | default "ClusterSecretStore" }}
          name: {{ $es.parameterStoreRef.name }}
      remoteRef:
        key: {{ printf "/%s/%s/%s" $prefix $service $key }}
    {{- end }}
{{- end }}
