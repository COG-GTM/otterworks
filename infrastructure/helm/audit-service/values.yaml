replicaCount: 1

image:
  repository: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/workshop/otterworks-audit-service
  tag: ""  # Set at deploy time (ECR uses IMMUTABLE tags)
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8090
  targetPort: 8090

# Reached only through the api-gateway (and report-service) inside the cluster.
ingress:
  enabled: false
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: audit-service.otterworks.workshop.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: audit-service-tls
      hosts:
        - audit-service.otterworks.workshop.example.com

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

healthCheck:
  path: /health
  port: 8090

monitoring:
  enabled: true
  path: /metrics
  port: 8090

networkPolicy:
  enabled: true
  monitoringNamespace: monitoring
  # Same-namespace workloads (by app.kubernetes.io/name) allowed to call the API.
  allowedClients:
    - api-gateway
    - report-service

serviceAccount:
  roleArn: ""

# Non-sensitive service configuration rendered into {{ .Release.Name }}-config
# and injected via envFrom. Populate at deploy time (e.g. from Terraform outputs).
config: {}

# Sensitive configuration rendered into {{ .Release.Name }}-secrets (Opaque,
# stringData) and injected via envFrom. Populate at deploy time; never commit values.
secrets: {}
