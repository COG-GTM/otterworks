apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
data:
  SPRING_PROFILES_ACTIVE: "postgres"
  SPRING_DATASOURCE_URL: {{ required "database.url must be set" .Values.database.url | quote }}
  SPRING_FLYWAY_SCHEMAS: {{ required "database.schema must be set" .Values.database.schema | quote }}
  SPRING_FLYWAY_DEFAULT_SCHEMA: {{ .Values.database.schema | quote }}
  {{- if .Values.probes.readinessIncludesDb }}
  MANAGEMENT_ENDPOINT_HEALTH_GROUP_READINESS_INCLUDE: "readinessState,db"
  {{- end }}
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
