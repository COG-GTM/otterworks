replicaCount: 2

image:
  repository: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/workshop/otterworks-announcements-service
  tag: ""  # Set at deploy time (ECR uses IMMUTABLE tags)
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8092
  targetPort: 8092

# Cluster-internal: the legacy-portal routes (/api/...) were never behind the
# api-gateway, whose /api/v1/preferences prefix already belongs to
# notification-service. Enable per environment if the portal is published.
ingress:
  enabled: false
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: announcements-service.otterworks.workshop.example.com
      paths:
        - path: /api
          pathType: Prefix
  tls:
    - secretName: announcements-service-tls
      hosts:
        - announcements-service.otterworks.workshop.example.com

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 100m
    memory: 512Mi

# Spring Boot 3 actuator probe groups. /health (legacy contract, kept for
# callers of the monolith) stays available on the same port.
healthCheck:
  livenessPath: /actuator/health/liveness
  readinessPath: /actuator/health/readiness

monitoring:
  enabled: true
  path: /actuator/prometheus
  port: 8092

networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx
  monitoringNamespace: monitoring

serviceAccount:
  roleArn: ""

# Non-sensitive service configuration rendered into {{ .Release.Name }}-config
# and injected via envFrom. deploy-dev.sh / deploy-tenant.sh fill in the
# datasource from Terraform outputs. The service owns only the `announcements` schema;
# Flyway baselines it on first boot against a database legacy-portal already populated.
config:
  SPRING_PROFILES_ACTIVE: postgres
  PORTAL_ENVIRONMENT: eks
  JAVA_OPTS: "-XX:MaxRAMPercentage=75"

# Sensitive configuration rendered into {{ .Release.Name }}-secrets (Opaque,
# stringData) and injected via envFrom. Populate at deploy time; never commit values.
secrets: {}
