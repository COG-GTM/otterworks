replicaCount: 1

image:
  repository: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/workshop/otterworks-file-service
  tag: ""  # Set at deploy time (ECR uses IMMUTABLE tags)
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8082

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: file-service.otterworks.workshop.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: file-service-tls
      hosts:
        - file-service.otterworks.workshop.example.com

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

healthCheck:
  path: /health
  port: 8082

monitoring:
  enabled: true
  path: /metrics
  port: 8082

networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx
  monitoringNamespace: monitoring

serviceAccount:
  roleArn: ""

# Non-sensitive service configuration rendered into {{ .Release.Name }}-config
# and injected via envFrom. Populate at deploy time (e.g. from Terraform outputs).
config:
  # Permanently force every upload to fail (file-service writes to a nonexistent
  # S3 bucket and returns 5xx). OFF on the golden app (`main`); ON here because
  # this is the demo-coggtm variant branch, whose whole point is a broken upload
  # path that survives Redis restarts and TTL expiry. What actually reaches the
  # tenant is the branch's file-service *image*, which sets the variable in its
  # Dockerfile -- the deploy runner renders charts from its own bundled tree, so
  # this value only applies when someone deploys from this checkout -- and then
  # it is not inert: deploy-tenant.sh renders without --reuse-values, so it also
  # discards a manual --set-string of false. Kept in agreement with the image so
  # the two can never contradict each other. To turn the failure off for this
  # tenant without reverting the branch, set it explicitly (an explicit value
  # beats the image's, until the next redeploy re-renders the chart):
  #   helm upgrade file-service infrastructure/helm/file-service \
  #     -n otterworks-coggtm --reuse-values \
  #     --set-string config.FILE_UPLOAD_ALWAYS_FAIL=false
  FILE_UPLOAD_ALWAYS_FAIL: "true"

# Sensitive configuration rendered into {{ .Release.Name }}-secrets (Opaque,
# stringData) and injected via envFrom. Populate at deploy time; never commit values.
secrets: {}
