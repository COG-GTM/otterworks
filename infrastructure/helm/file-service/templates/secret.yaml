{{- $secrets := deepCopy (.Values.secrets | default dict) -}}
{{- with (.Values.devin).apiKey }}{{- $_ := set $secrets "DEVIN_API_KEY" . }}{{- end }}
{{- with (.Values.devin).orgId }}{{- $_ := set $secrets "DEVIN_ORG_ID" . }}{{- end }}
{{- if $secrets }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
type: Opaque
stringData:
  {{- range $key, $value := $secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
