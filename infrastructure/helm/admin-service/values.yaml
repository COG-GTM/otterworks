replicaCount: 1

image:
  repository: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/otterworks/admin-service
  tag: ""  # Set at deploy time (ECR uses IMMUTABLE tags)
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8089

ingress:
  enabled: true
  className: nginx
  # Rendered as cert-manager.io/cluster-issuer only when a tls entry sets
  # secretName (per-ingress cert). tls entries without secretName use the shared
  # wildcard cert served by ingress-nginx, so no issuer is needed.
  certManager:
    clusterIssuer: letsencrypt-prod
  annotations: {}
  hosts:
    - host: admin-service.otterworks.workshop.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: admin-service-tls
      hosts:
        - admin-service.otterworks.workshop.example.com

# Rails needs more headroom than the slim-service default: boot + db:migrate
# on a throttled CPU takes minutes, and the VM comfortably exceeds 256Mi.
resources:
  limits:
    cpu: "1"
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 256Mi

healthCheck:
  path: /health
  port: 8089

monitoring:
  enabled: true
  path: /metrics
  port: 8089

networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx
  monitoringNamespace: monitoring

serviceAccount:
  roleArn: ""

# Non-sensitive service configuration rendered into {{ .Release.Name }}-config
# and injected via envFrom. Populate at deploy time (e.g. from Terraform outputs).
config: {}

# Sensitive configuration rendered into {{ .Release.Name }}-secrets (Opaque,
# stringData) and injected via envFrom. Populate at deploy time; never commit values.
secrets: {}
