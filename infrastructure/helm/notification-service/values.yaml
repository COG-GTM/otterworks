replicaCount: 1

image:
  repository: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/workshop/otterworks-notification-service
  tag: ""  # Set at deploy time (ECR uses IMMUTABLE tags)
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8086

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: notification-service.otterworks.workshop.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: notification-service-tls
      hosts:
        - notification-service.otterworks.workshop.example.com

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

healthCheck:
  path: /health
  port: 8086

monitoring:
  enabled: true
  path: /metrics
  port: 8086

networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx
  monitoringNamespace: monitoring

serviceAccount:
  roleArn: ""

# Non-sensitive service configuration rendered into {{ .Release.Name }}-config
# and injected via envFrom. Populate at deploy time (e.g. from Terraform outputs).
config:
  # Failure switch: when true the SQS consumer polls a nonexistent queue and
  # every ReceiveMessage fails with a real AWS SQS error, firing the
  # NotificationConsumerProcessingErrors alert at admin-service. OFF by
  # default everywhere (matches the image's Dockerfile default); enable per
  # tenant with scripts/inject-bug.sh <id> notification-queue-fail, or:
  #   helm upgrade notification-service infrastructure/helm/notification-service \
  #     -n otterworks-<id> --reuse-values \
  #     --set-string config.NOTIFICATION_SQS_ALWAYS_FAIL=true
  NOTIFICATION_SQS_ALWAYS_FAIL: "false"

# Sensitive configuration rendered into {{ .Release.Name }}-secrets (Opaque,
# stringData) and injected via envFrom. Populate at deploy time; never commit values.
secrets: {}

# External Secrets Operator (docs/SECRETS.md). Off by default; when enabled the
# chart renders an ExternalSecret that syncs the keys below into the Secret
# <release>-external-secrets, envFrom'd after <release>-config/-secrets (so it
# wins on conflicts). The ClusterSecretStores come from the shared platform
# add-on demo-platform/scripts/install-external-secrets.sh.
#   secrets:    ENV_VAR -> Secrets Manager  <keyPrefix>/<service>/<KEY>
#   parameters: ENV_VAR -> SSM Parameter   /<keyPrefix>/<service>/<KEY>
#   templates:  ENV_VAR -> ESO v2 template over the synced keys (set at deploy)
# Set an entry to null to drop it (e.g. tenants keep their own JWT secret).
externalSecrets:
  enabled: false
  keyPrefix: otterworks/dev
  service: notification-service
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: otterworks-secretsmanager
  parameterStoreRef:
    kind: ClusterSecretStore
    name: otterworks-parameterstore
  secrets:
    ALERT_WEBHOOK_SECRET: ALERT_WEBHOOK_SECRET
  parameters:
    AWS_REGION: AWS_REGION
    DYNAMODB_TABLE_NOTIFICATIONS: DYNAMODB_TABLE_NOTIFICATIONS
    SNS_TOPIC_ARN: SNS_TOPIC_ARN
    SQS_QUEUE_URL: SQS_QUEUE_URL
  templates: {}
