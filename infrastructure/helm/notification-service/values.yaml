replicaCount: 1

image:
  repository: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/workshop/otterworks-notification-service
  tag: ""  # Set at deploy time (ECR uses IMMUTABLE tags)
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8086

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: notification-service.otterworks.workshop.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: notification-service-tls
      hosts:
        - notification-service.otterworks.workshop.example.com

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

healthCheck:
  path: /health
  port: 8086

monitoring:
  enabled: true
  path: /metrics
  port: 8086

networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx
  monitoringNamespace: monitoring

serviceAccount:
  roleArn: ""

# Non-sensitive service configuration rendered into {{ .Release.Name }}-config
# and injected via envFrom. Populate at deploy time (e.g. from Terraform outputs).
config:
  # Permanently break the SQS consumer (it polls a nonexistent queue and every
  # ReceiveMessage fails with a real AWS SQS error, firing the
  # NotificationConsumerProcessingErrors alert at admin-service). OFF on the
  # golden app (`main` upstream); ON here because this is the demo variant,
  # whose broken consumer must survive Redis restarts and TTL expiry. What
  # actually reaches the tenant is the branch's notification-service *image*,
  # which sets the variable in its Dockerfile -- the deploy runner renders
  # charts from its own bundled tree, so this value only applies when someone
  # deploys from this checkout. Kept in agreement with the image so the two
  # can never contradict each other. To turn the failure off for this tenant
  # without reverting the branch, set it explicitly (an explicit value beats
  # the image's, until the next redeploy re-renders the chart):
  #   helm upgrade notification-service infrastructure/helm/notification-service \
  #     -n otterworks-coggtm --reuse-values \
  #     --set-string config.NOTIFICATION_SQS_ALWAYS_FAIL=false
  NOTIFICATION_SQS_ALWAYS_FAIL: "true"

# Sensitive configuration rendered into {{ .Release.Name }}-secrets (Opaque,
# stringData) and injected via envFrom. Populate at deploy time; never commit values.
secrets: {}
