replicaCount: 1

image:
  repository: <AWS_ACCOUNT_ID>.dkr.ecr.us-east-1.amazonaws.com/workshop/otterworks-collab-service
  tag: ""  # Set at deploy time (ECR uses IMMUTABLE tags)
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8084
  targetPort: 8084

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: collab-service.otterworks.workshop.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: collab-service-tls
      hosts:
        - collab-service.otterworks.workshop.example.com

resources:
  limits:
    cpu: 500m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

healthCheck:
  path: /health
  port: 8084

monitoring:
  enabled: true
  path: /metrics
  port: 8084

networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx
  monitoringNamespace: monitoring

serviceAccount:
  roleArn: ""

# Non-sensitive service configuration rendered into {{ .Release.Name }}-config
# and injected via envFrom. Populate at deploy time (e.g. from Terraform outputs).
config: {}

# Sensitive configuration rendered into {{ .Release.Name }}-secrets (Opaque,
# stringData) and injected via envFrom. Populate at deploy time; never commit values.
secrets: {}

# OpenTelemetry export to the shared in-cluster collector (installed once per
# cluster by demo-platform/scripts/install-observability.sh). Off by default.
# When enabled the pod gets OTEL_EXPORTER_OTLP_ENDPOINT, OTEL_SERVICE_NAME and
# OTEL_RESOURCE_ATTRIBUTES (incl. the tenant namespace). ServiceMonitor scraping
# stays under `monitoring:` and is still gated on the monitoring.coreos.com CRDs.
observability:
  otel:
    enabled: false
    endpoint: http://otel-collector.monitoring.svc.cluster.local:4318
    protocol: http/protobuf
    serviceName: ""          # defaults to the chart name
    resourceAttributes: {}   # extra key=value pairs appended to OTEL_RESOURCE_ATTRIBUTES
