# OtterWorks enterprise-drive seed loader — TEMPLATE.
#
# Runs testdata/generated/retail-drive/generate_drive.py against the in-cluster
# API gateway so a freshly spun-up (or re-seeded) OtterWorks environment gets the
# full, browsable multimodal drive. Idempotent: safe to re-run.
#
# This file is not applied directly: every tenant lives in its own namespace
# (otterworks-<id>) with its own api-gateway Service, so the namespace, the
# gateway URL and the volume knobs are placeholder tokens (spelled __NAME__ in
# the body) rendered by ./render-seed-job.sh, the same convention
# scripts/enable-dns-tls.sh uses for demo-platform/k8s/dns-tls:
#
#   TENANT_NAMESPACE  otterworks-<id> (or `otterworks` for a single-tenant deploy)
#   GATEWAY_URL       http://api-gateway.<namespace>.svc.cluster.local:8080
#   SCALE             axis breadth multiplier (1.0 ≈ 2,445 files, 0.1 ≈ 110)
#   DEPARTMENTS       comma-separated department names, or `all`
#   REPO_URL/REPO_REF repo the init container clones the generator from
#
#   # 1. create the credentials secret in the TENANT namespace (once)
#   kubectl -n otterworks-coggtm create secret generic retail-drive-seed \
#       --from-literal=DRIVE_EMAIL='<drive-account-email>' \
#       --from-literal=DRIVE_PASSWORD='<pick-a-password>'
#
#   # 2. render + run the loader
#   testdata/generated/retail-drive/render-seed-job.sh coggtm 0.1 | kubectl apply -f -
#   kubectl -n otterworks-coggtm logs -f job/retail-drive-seed-loader
#
# An init container clones the repo into a shared volume; the loader container
# builds a venv in that volume and runs the generator. Both run as a non-root
# user with privilege escalation disabled and all capabilities dropped.
apiVersion: batch/v1
kind: Job
metadata:
  name: retail-drive-seed-loader
  namespace: __TENANT_NAMESPACE__
  labels:
    app.kubernetes.io/name: retail-drive-seed-loader
    app.kubernetes.io/part-of: otterworks-seed
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: retail-drive-seed-loader
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: work
          emptyDir: {}
      initContainers:
        - name: clone
          image: alpine/git:2.45.2
          env:
            - name: REPO_URL
              value: "__REPO_URL__"
            - name: REPO_REF
              value: "__REPO_REF__"
          command: ["/bin/sh", "-c"]
          args:
            - git clone --depth 1 --branch "$REPO_REF" "$REPO_URL" /work/src
          volumeMounts:
            - name: work
              mountPath: /work
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: loader
          image: python:3.11-slim
          workingDir: /work/src/testdata/generated/retail-drive
          env:
            - name: HOME
              value: "/work"
            - name: GATEWAY_URL
              value: "__GATEWAY_URL__"
            - name: SCALE
              value: "__SCALE__"
            - name: DEPARTMENTS
              value: "__DEPARTMENTS__"
            - name: DRIVE_EMAIL
              valueFrom:
                secretKeyRef:
                  name: retail-drive-seed
                  key: DRIVE_EMAIL
            - name: DRIVE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: retail-drive-seed
                  key: DRIVE_PASSWORD
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              python -m venv /work/venv
              /work/venv/bin/pip install --no-cache-dir -q -r requirements.txt
              /work/venv/bin/python generate_drive.py \
                --gateway "$GATEWAY_URL" \
                --email "$DRIVE_EMAIL" --password "$DRIVE_PASSWORD" \
                --departments "$DEPARTMENTS" --scale "$SCALE" \
                --workers 6 --register
          volumeMounts:
            - name: work
              mountPath: /work
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
