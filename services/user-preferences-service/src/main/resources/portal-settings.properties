# Portal branding, carried over from legacy-portal. Resolved with Spring's own
# placeholder support (no Commons Configuration / Commons Text on the classpath).
# Packaged default matches legacy-portal byte-for-byte; the Helm chart overrides it
# per environment through the PORTAL_ENVIRONMENT env var.
portal.environment=on-prem
portal.support=portal-support@otterworks.example
portal.banner=OtterWorks Portal (${portal.environment}) - contact ${portal.support}
