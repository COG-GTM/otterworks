[project]
name = "commission-service"
version = "0.1.0"
description = "Insurance Commission Pay extracted from COMMISSION_PKG / DW_ETL_PKG (Oracle PL/SQL)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
  "pydantic>=2.6,<3",
  "pydantic-settings>=2.2,<3",
  "psycopg[binary]>=3.2,<4",
  "PyJWT>=2.8,<3",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "ruff>=0.9,<1",
  "mypy>=1.10,<2",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
packages = ["app"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "rule(rule_id): associates a test with a rule ledger id in services/industry-solutions/insurance/parity/rules",
  "integration: needs a live Postgres (COMMISSION_TEST_DATABASE_URL)",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N817"]
