[package]
name = "file-service"
version = "0.1.0"
edition = "2021"
authors = ["OtterWorks Engineering"]

[dependencies]
actix-web = { version = "4", default-features = false, features = ["macros", "compress-brotli", "compress-gzip", "compress-zstd", "cookies", "unicode", "compat", "ws"] }
actix-multipart = "0.8.5"
actix-rt = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
tracing-actix-web = "0.7"
tracing-opentelemetry = "0.34.0"
opentelemetry = "0.33.1"
opentelemetry_sdk = { version = "0.33.1", features = ["rt-tokio"] }
opentelemetry-otlp = "0.33.1"
aws-config = "1.12.0"
aws-sdk-s3 = { version = "1.152.0", default-features = false, features = ["sigv4a", "http-1x", "default-https-client", "rt-tokio"] }
aws-sdk-dynamodb = { version = "1.130.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sns = { version = "1.116.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-smithy-types = "1.8.1"
futures-util = "0.3"
bytes = "1"
mime = "0.3"
thiserror = "2.0.21"
anyhow = "1"
dotenvy = "0.15"
prometheus = "0.14.0"
lazy_static = "1.4"
redis = { version = "1.7.1", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }

[dev-dependencies]
actix-rt = "2"
actix-web = { version = "4", default-features = false }
tokio = { version = "1", features = ["full", "test-util"] }
