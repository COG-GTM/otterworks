// repo.maven.apache.org aggressively rate-limits shared CI egress IPs (HTTP 429).
// Prefer Google's Maven Central mirror everywhere and keep the original
// repositories as fallback for artifacts the mirror doesn't carry.
// NOTE: services/auth-service and services/notification-service each carry a
// byte-identical copy of this file (the Docker build context is the service
// directory, so a shared root-level file cannot be COPY'd) -- keep them in sync.
// .devin/blueprint.yaml also installs a copy as ~/.gradle/init.d/maven-central-mirror.gradle,
// which is baked into the snapshot: edits here reach sessions only after initialize re-runs.
def MIRROR = 'https://maven-central.storage-download.googleapis.com/maven2'

def preferMirror = { repos ->
    if (repos.findByName('MavenCentralMirror') == null) {
        def m = repos.maven { repo ->
            repo.name = 'MavenCentralMirror'
            repo.url = MIRROR
        }
        repos.remove(m)
        repos.add(0, m)
    }
}

settingsEvaluated { settings ->
    def repos = settings.pluginManagement.repositories
    preferMirror(repos)
    // Declaring any repository here removes the implicit plugin portal; re-add
    // it as fallback for plugins whose markers aren't on Maven Central.
    def hasPortal = repos.any { repo ->
        repo instanceof org.gradle.api.artifacts.repositories.MavenArtifactRepository &&
                repo.url.toString().contains('plugins.gradle.org')
    }
    if (!hasPortal) {
        repos.gradlePluginPortal()
    }
}

allprojects { project ->
    preferMirror(project.buildscript.repositories)
    preferMirror(project.repositories)
}
