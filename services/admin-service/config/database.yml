default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  port: <%= ENV.fetch("DATABASE_PORT", 5432) %>
  username: <%= ENV.fetch("DATABASE_USER", "otterworks") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "otterworks") %>

development:
  <<: *default
  database: admin_service_development

test:
  <<: *default
  database: admin_service_test

production:
  <<: *default
  # Tenant deploys provision one shared per-tenant database (otterworks_<id>)
  # rather than a per-service one, and now pass it as DATABASE_NAME. The
  # fallback only exists for a deploy that predates that wiring, and names the
  # one tenant this branch ships to.
  database: <%= ENV.fetch("DATABASE_NAME", "otterworks_coggtm") %>
