server:
  port: 8098
  # server.error.include-* and spring.mvc.problemdetails.enabled come from portal-common
  # (docs/legacy-portal-decomposition.md §12).

spring:
  application:
    name: feedback-service
  # Default profile: embedded H2. DATABASE_TO_LOWER folds unquoted identifiers to lower case
  # as PostgreSQL does, so Flyway, the migrations and Hibernate all see schema "feedback".
  datasource:
    url: 'jdbc:h2:mem:feedback;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE'
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  flyway:
    schemas: feedback
    default-schema: feedback
    locations: classpath:db/migration/{vendor}
  jpa:
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

---
# Compose stack: the tenant's single PostgreSQL database. The feedback schema and its
# owning role are created at database init time by scripts/initdb.sh; the service connects
# with that role's own credentials and never creates schemas.
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/otterworks}
    username: ${SPRING_DATASOURCE_USERNAME:feedback}
    password: ${SPRING_DATASOURCE_PASSWORD:feedback}
    driver-class-name: org.postgresql.Driver
  flyway:
    create-schemas: false
