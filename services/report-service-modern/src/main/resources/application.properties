# OtterWorks Report Service (modern) — same port, service name and endpoints as services/report-service
server.port=${SERVER_PORT:8091}

spring.application.name=report-service
info.app.name=OtterWorks Report Service
info.app.version=0.1.0

# Database (PostgreSQL). DB_SCHEMA lets the modern service run side by side with the legacy one
# on the same database without sharing its table (defaults to the legacy schema: public).
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:otterworks_reports}?currentSchema=${DB_SCHEMA:public}
spring.datasource.username=${DB_USER:otterworks}
spring.datasource.password=${DB_PASSWORD:otterworks_dev}

# JPA / Hibernate 6
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:public}
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
# Keep Instant columns as plain "timestamp" so the table layout matches the legacy Date mapping
spring.jpa.properties.hibernate.type.preferred_instant_jdbc_type=TIMESTAMP
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Java 21 virtual threads for request handling and @Async report generation
spring.threads.virtual.enabled=true

# Actuator
# nosemgrep: java.spring.security.audit.spring-actuator-non-health-enabled.spring-actuator-dangerous-endpoints-enabled
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized

# springdoc (OpenAPI 3) — /v3/api-docs and /swagger-ui.html
springdoc.packages-to-scan=com.otterworks.report.controller

# Service URLs
otterworks.analytics-service.url=${ANALYTICS_SERVICE_URL:http://analytics-service:8088}
otterworks.audit-service.url=${AUDIT_SERVICE_URL:http://audit-service:8090}
otterworks.auth-service.url=${AUTH_SERVICE_URL:http://auth-service:8081}

# Report settings
otterworks.report.output-dir=${REPORT_OUTPUT_DIR:/tmp/reports}
otterworks.report.max-rows=${REPORT_MAX_ROWS:50000}
otterworks.report.connection-timeout=5000ms
otterworks.report.read-timeout=30000ms

# Logging
logging.level.com.otterworks=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
