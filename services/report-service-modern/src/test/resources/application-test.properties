# Test configuration — H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_schema=
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=false
otterworks.analytics-service.url=http://127.0.0.1:9
otterworks.audit-service.url=http://127.0.0.1:9
otterworks.auth-service.url=http://127.0.0.1:9
otterworks.report.output-dir=${java.io.tmpdir}/otterworks-report-modern-tests
