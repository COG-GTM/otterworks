server:
  port: 8095
  # server.error.include-* and spring.mvc.problemdetails.enabled come from portal-common
  # (DECOMPOSITION.md §12).

spring:
  application:
    name: legacy-portal
  # Default profile: embedded H2 with ONE SCHEMA PER BOUNDED CONTEXT still in the monolith.
  # The schema boundaries (user_preferences / feedback) are the decomposition seams;
  # announcements has moved to services/announcements-service (DECOMPOSITION.md §13).
  datasource:
    url: 'jdbc:h2:mem:legacyportal;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;INIT=CREATE SCHEMA IF NOT EXISTS USER_PREFERENCES\;CREATE SCHEMA IF NOT EXISTS FEEDBACK'
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

---
# On-prem / VM profile: talks to a real PostgreSQL running alongside the app on the VM
# (see docker-compose.onprem.yml and scripts/run-onprem.sh). The monolith's schemas are
# created by scripts/initdb.sql at database init time.
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/legacyportal}
    username: ${SPRING_DATASOURCE_USERNAME:legacyportal}
    password: ${SPRING_DATASOURCE_PASSWORD:legacyportal}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
