[tool.poetry]
name = "document-service"
version = "0.1.0"
description = "OtterWorks Document Service - Document CRUD, versioning, and content management"
authors = ["OtterWorks Engineering"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.165.0"
uvicorn = {extras = ["standard"], version = "^0.54.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.1.9"}
asyncpg = "^0.32.0"
alembic = "^1.13.1"
pydantic = "^2.6.4"
pydantic-settings = "^2.2.1"
structlog = "^26.1.0"
opentelemetry-api = "^1.45.2"
opentelemetry-sdk = "^1.45.2"
opentelemetry-exporter-otlp = "^1.45.2"
opentelemetry-instrumentation-fastapi = "^0.66b2"
prometheus-fastapi-instrumentator = "^8.1.0"
python-multipart = ">=0.0.30,<0.1.0"
httpx = "^0.28.1"
boto3 = "^1.34.0"
PyJWT = "^2.8.0"
redis = "^8.2.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.2.0"
pytest-asyncio = "^1.5.0"
pytest-cov = "^7.1.0"
ruff = "^0.17.6"
mypy = "^2.4.1"
httpx = "^0.28.1"
aiosqlite = "^0.22.1"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
