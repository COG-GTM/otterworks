[tool.poetry]
name = "document-service"
version = "0.1.0"
description = "OtterWorks Document Service - Document CRUD, versioning, and content management"
authors = ["OtterWorks Engineering"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.143.0"
uvicorn = {extras = ["standard"], version = "^0.54.0"}
sqlalchemy = {extras = ["asyncio"], version = "^2.1.4"}
asyncpg = "^0.32.0"
alembic = "^1.20.0"
pydantic = "^2.14.1"
pydantic-settings = "^2.15.0"
structlog = "^26.1.0"
opentelemetry-api = "^1.45.1"
opentelemetry-sdk = "^1.45.1"
opentelemetry-exporter-otlp = "^1.45.1"
opentelemetry-instrumentation-fastapi = "^0.66b1"
prometheus-fastapi-instrumentator = "^8.1.0"
python-multipart = ">=0.0.32,<0.1.0"
httpx = "^0.28.1"
boto3 = "^1.43.0"
PyJWT = "^2.15.1"
redis = "^8.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.1.1"
pytest-asyncio = "^1.4.0"
pytest-cov = "^7.1.0"
ruff = "^0.17.0"
mypy = "^2.4.0"
httpx = "^0.28.1"
aiosqlite = "^0.22.1"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
