server:
  port: 8097
  # server.error.include-* and spring.mvc.problemdetails.enabled come from portal-common
  # (DECOMPOSITION.md §12).

spring:
  application:
    name: preferences-service
  # Default profile: embedded H2. DATABASE_TO_LOWER folds unquoted identifiers to lower case
  # as PostgreSQL does, so Flyway, the migrations and Hibernate all see schema "user_preferences".
  datasource:
    url: 'jdbc:h2:mem:preferences;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;DATABASE_TO_LOWER=TRUE'
    username: sa
    password: ''
    driver-class-name: org.h2.Driver
  flyway:
    schemas: user_preferences
    default-schema: user_preferences
    locations: classpath:db/migration/{vendor}
  jpa:
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

---
# Compose stack: the tenant's single PostgreSQL database. The user_preferences schema and its
# owning role are created at database init time by scripts/initdb.sh; the service connects
# with that role's own credentials and never creates schemas.
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/legacyportal}
    username: ${SPRING_DATASOURCE_USERNAME:preferences}
    password: ${SPRING_DATASOURCE_PASSWORD:preferences}
    driver-class-name: org.postgresql.Driver
  flyway:
    create-schemas: false
