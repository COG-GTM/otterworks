name: report-service-modern

on:
  push:
    branches: [main]
    paths:
      - 'services/report-service-modern/**'
      - '.github/workflows/report-service-modern.yml'
  pull_request:
    paths:
      - 'services/report-service-modern/**'
      - '.github/workflows/report-service-modern.yml'

permissions:
  contents: read

concurrency:
  group: report-service-modern-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: JDK 21 build, unit + golden contract tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/report-service-modern
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: services/report-service-modern/pom.xml
      - run: mvn -B verify
      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-service-modern-surefire
          path: services/report-service-modern/target/surefire-reports/
          if-no-files-found: ignore

  docker-build:
    name: Docker image build + smoke
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t report-service-modern:ci services/report-service-modern
      - name: Verify non-root runtime user
        run: test "$(docker image inspect --format '{{.Config.User}}' report-service-modern:ci)" = "1001:1001"
      - name: Smoke test /health against Postgres
        run: |
          docker network create rsm
          docker run -d --name pg --network rsm -e POSTGRES_USER=otterworks -e POSTGRES_PASSWORD=otterworks_dev \
            -e POSTGRES_DB=otterworks_reports postgres:16-alpine
          for i in $(seq 1 30); do docker exec pg pg_isready -U otterworks && break; sleep 1; done
          docker run -d --name app --network rsm -p 8091:8091 -e DB_HOST=pg report-service-modern:ci
          for i in $(seq 1 60); do curl -fsS http://localhost:8091/health && exit 0; sleep 2; done
          docker logs app; exit 1
