# Offline validation for the External Secrets Operator wiring (docs/SECRETS.md).
# Renders and schema-checks only: it never talks to AWS or a cluster, and
# merging it applies nothing.
name: External Secrets validate

on:
  pull_request:
    branches: [main]
    paths:
      - "infrastructure/helm/**"
      - "infrastructure/terraform/secrets.tf"
      - "infrastructure/terraform/modules/secrets/**"
      - "demo-platform/k8s/external-secrets/**"
      - "demo-platform/scripts/install-external-secrets.sh"
      - "scripts/lib/external-secrets.sh"
      - "scripts/validate-external-secrets.sh"
      - "scripts/deploy-dev.sh"
      - "scripts/deploy-tenant.sh"
      - ".github/workflows/external-secrets-validate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  charts:
    name: Helm render (externalSecrets on/off) + kubeconform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - name: Install kubeconform
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz \
            | sudo tar -xz -C /usr/local/bin kubeconform
          python3 -c 'import yaml' || pip install pyyaml
      - run: scripts/validate-external-secrets.sh

  scripts:
    name: shellcheck ESO scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          shellcheck scripts/lib/external-secrets.sh scripts/validate-external-secrets.sh \
            demo-platform/scripts/install-external-secrets.sh
          bash -n scripts/deploy-dev.sh scripts/deploy-tenant.sh

  terraform:
    name: terraform validate (secrets module)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infrastructure/terraform/modules/secrets
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false
      - run: terraform validate
