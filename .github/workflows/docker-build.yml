name: Docker Build & Push

on:
  push:
    branches: [main]
    tags: ['v*']

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/workshop

permissions:
  id-token: write
  contents: read

jobs:
  # Java test gate - images are not built or pushed unless these pass
  auth-service-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
      - run: gradle check --no-daemon

  report-service-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/report-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B verify

  legacy-portal-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/legacy-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - run: ./mvnw test -B

  build-and-push:
    needs: [auth-service-tests, report-service-tests, legacy-portal-tests]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - { name: api-gateway, context: services/api-gateway }
          - { name: auth-service, context: services/auth-service }
          - { name: file-service, context: services/file-service }
          - { name: document-service, context: services/document-service }
          - { name: collab-service, context: services/collab-service }
          - { name: notification-service, context: services/notification-service }
          - { name: search-service, context: services/search-service }
          - { name: analytics-service, context: services/analytics-service }
          - { name: admin-service, context: services/admin-service }
          - { name: audit-service, context: services/audit-service }
          - { name: web-app, context: frontend/client-app }
          - { name: admin-dashboard, context: frontend/admin-dashboard }

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/otterworks-${{ matrix.service.name }}:${{ github.sha }}
            ${{ env.ECR_REGISTRY }}/otterworks-${{ matrix.service.name }}:latest
