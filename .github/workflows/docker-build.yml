name: Docker Build & Push

# Release builds. Every service is published at one version, so a release is a
# complete, self-consistent set of images.
#
# Branch and `main` builds are not here -- they belong to cd-tenant.yml, which
# builds only what changed and then ships it to the tenant that owns the branch.
#
# Dispatch-only, and deliberately not triggered by pushing a `v*` tag: the CD
# role trusts refs/heads/main, workshop-* and demo-* and nothing else, so a
# tag-triggered run could not assume it. Run this from `main` and pass the
# version you are cutting.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to tag the images with, e.g. v1.4.0
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1

jobs:
  # Java test gate - images are not built or pushed unless these pass
  auth-service-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/auth-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
      - run: gradle check --no-daemon

  report-service-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/report-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - run: mvn test -B

  legacy-portal-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/legacy-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
      - run: ./mvnw test -B

  build-and-push:
    needs: [auth-service-tests, report-service-tests, legacy-portal-tests]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: api-gateway, context: services/api-gateway }
          - { name: auth-service, context: services/auth-service }
          - { name: file-service, context: services/file-service }
          - { name: document-service, context: services/document-service }
          - { name: collab-service, context: services/collab-service }
          - { name: notification-service, context: services/notification-service }
          - { name: search-service, context: services/search-service }
          - { name: analytics-service, context: services/analytics-service }
          - { name: admin-service, context: services/admin-service }
          - { name: audit-service, context: services/audit-service }
          - { name: report-service, context: services/report-service }
          - { name: web-app, context: frontend/client-app }
          - { name: admin-dashboard, context: frontend/admin-dashboard }

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Validate version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # The version becomes a Docker tag, so reject anything a registry
          # would refuse (or that would silently overwrite `main`).
          [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] ||
            { echo "::error::version '${VERSION}' is not vMAJOR.MINOR.PATCH"; exit 1; }

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push image
        id: build
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: ${{ matrix.service.context }}
          push: true
          # One manifest list per release; amd64 nodes resolve the same tags as
          # before. BuildKit attaches an SPDX SBOM and SLSA provenance to it.
          platforms: linux/amd64,linux/arm64
          sbom: true
          provenance: mode=max
          # otterworks/<service>: the repository layout every deploy script
          # reads (ECR_PREFIX in scripts/lib/tenant-common.sh). Images published
          # anywhere else are simply never deployed.
          tags: |
            ${{ steps.ecr.outputs.registry }}/otterworks/${{ matrix.service.name }}:${{ inputs.version }}
            ${{ steps.ecr.outputs.registry }}/otterworks/${{ matrix.service.name }}:${{ github.sha }}

      # Keyless signing: the certificate is issued to this workflow's GitHub
      # OIDC identity, so there is no key to store or rotate. See
      # docs/SUPPLY-CHAIN.md for verifying from outside CI.
      - uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3

      - name: Sign image and attest SBOMs
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/otterworks/${{ matrix.service.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          NAME: ${{ matrix.service.name }}
        run: |
          set -euo pipefail
          # ECR tags are IMMUTABLE and cosign stores each signature/attestation
          # under a sha256-<digest>.{sig,att} tag, so every digest is signed and
          # attested exactly once, here.
          cosign sign --yes "${IMAGE}@${DIGEST}"
          mkdir -p sbom
          docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}" |
            jq -r '.manifests[] | select(.platform.os != "unknown") |
              "\(.platform.os)/\(.platform.architecture) \(.digest)"' |
          while read -r platform platform_digest; do
            sbom="sbom/${NAME}-${platform#*/}.spdx.json"
            docker buildx imagetools inspect "${IMAGE}@${DIGEST}" \
              --format "{{ json (index .SBOM \"${platform}\").SPDX }}" > "${sbom}"
            cosign attest --yes --type spdxjson --predicate "${sbom}" "${IMAGE}@${platform_digest}"
          done

      - name: Verify signature and SBOM attestations
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/otterworks/${{ matrix.service.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
          IDENTITY: https://github.com/${{ github.workflow_ref }}
        run: |
          set -euo pipefail
          verify=(--certificate-identity "${IDENTITY}"
                  --certificate-oidc-issuer https://token.actions.githubusercontent.com)
          cosign verify "${verify[@]}" "${IMAGE}@${DIGEST}" > /dev/null
          docker buildx imagetools inspect --raw "${IMAGE}@${DIGEST}" |
            jq -r '.manifests[] | select(.platform.os != "unknown") | .digest' |
          while read -r platform_digest; do
            cosign verify-attestation "${verify[@]}" --type spdxjson "${IMAGE}@${platform_digest}" > /dev/null
          done
          echo "Verified ${IMAGE}@${DIGEST} as signed by ${IDENTITY}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ matrix.service.name }}-${{ inputs.version }}
          path: sbom/
