server {
    listen 4200;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # See frontend/client-app/nginx/default.conf.template: recover the real
    # client behind the shared ingress so the gateway rate-limits per user.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from ::1/128;
    set_real_ip_from fc00::/7;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        client_max_body_size 100m;
        proxy_pass http://api-gateway:8080;
        proxy_set_header Host $http_host; # nosemgrep: generic.nginx.security.request-host-used.request-host-used
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy","service":"admin-dashboard"}';
    }
}
