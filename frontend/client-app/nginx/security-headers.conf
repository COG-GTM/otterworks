# Browser security headers for every response the web-app serves.
#
# nginx only inherits add_header from the enclosing level when a location sets
# none of its own, so any location that adds a header (e.g. Cache-Control on
# /assets/) must include this file again.
#
# CSP: scripts are same-origin only (the Vite build emits no inline scripts).
# style-src allows inline styles because react-hot-toast and Tiptap inject
# <style> tags at runtime. File previews load presigned S3 URLs (https:), and
# the collab websocket defaults to ws://localhost:<port> in local builds.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; font-src 'self' data:; connect-src 'self' https: wss: ws://localhost:*; frame-src 'self' blob: https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Ignored by browsers over plain HTTP; takes effect behind the TLS ingress.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
