# Inventory of every JVM service in the repo for the Java 17 / Spring Boot 3.2 migration.
# A service counts as "on 17" only when its build file, Dockerfile base images and CI job agree.
repo: https://github.com/COG-GTM/otterworks
default_branch: main
services:
  - name: report-service
    path: services/report-service
    build: maven
    java: 8
    framework: spring-boot 2.5.14
    dockerfile: maven:3.8.7-eclipse-temurin-8 / eclipse-temurin:8-jre
    ci: ci.yml report-service (java 8), docker-build.yml report-service-tests (java 8)
    class: migrate
  - name: legacy-portal
    path: services/legacy-portal
    build: maven
    java: 11
    framework: spring-boot 2.7.18
    dockerfile: maven:3.9-eclipse-temurin-11 / eclipse-temurin:11-jre-jammy
    ci: ci.yml legacy-portal (java 11), docker-build.yml legacy-portal-tests (java 11)
    class: migrate
  - name: auth-service
    path: services/auth-service
    build: gradle
    java: 17
    framework: spring-boot 3.2.4
    dockerfile: gradle:8.6-jdk17 / eclipse-temurin:17-jre-jammy
    ci: ci.yml auth-service (java 17), docker-build.yml auth-service-tests (java 17)
    class: verify
  - name: notification-service
    path: services/notification-service
    build: gradle-kts
    java: 17            # jvmToolchain(17)
    framework: ktor 2.3.9 (kotlin 1.9.23)
    dockerfile: gradle:8.6-jdk17 / eclipse-temurin:17-jre-jammy
    ci: ci.yml notification-service (java 17)
    class: jdk-only
  - name: analytics-service
    path: services/analytics-service
    build: sbt
    java: 17            # sbtscala/scala-sbt temurin 17 image
    framework: akka-http (scala 3.4.0)
    dockerfile: sbtscala/scala-sbt:eclipse-temurin-jammy-17.0.10_7_1.9.9_3.4.1 / eclipse-temurin:17-jre-jammy
    ci: ci.yml analytics-service (java 17)
    class: jdk-only
# Non-JVM services (no work): admin-service (ruby), api-gateway (go), audit-service (.net),
# collab-service (node), document-service (python), file-service (rust), search-service (python).
# frontend/client-app/mobile/android is an Android Gradle build, already on JDK 17 (PR #14).
targets:
  java: 17
  spring_boot: 3.2.5
demo_mode: true
