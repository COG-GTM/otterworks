# Java 17 / Spring Boot 3.2 migration intake
# Generated by inventorying every JVM build file in the repo (pom.xml, build.gradle,
# build.gradle.kts, build.sbt) plus each service's Dockerfile base images and CI job pin.
repo: https://github.com/COG-GTM/otterworks
default_branch: main

services:
  - name: report-service
    path: services/report-service
    build: maven
    java: 8                      # <java.version>1.8</java.version>
    framework: spring-boot 2.5.14
    dockerfile: maven:3.8.7-eclipse-temurin-8 / eclipse-temurin:8-jre
    ci: ci.yml report-service (java-version '8'), docker-build.yml report-service-tests ('8')
    class: migrate

  - name: legacy-portal
    path: services/legacy-portal
    build: maven
    java: 11                     # <java.version>11</java.version>
    framework: spring-boot 2.7.18
    dockerfile: maven:3.9-eclipse-temurin-11 / eclipse-temurin:11-jre-jammy
    ci: ci.yml legacy-portal (java-version '11'), docker-build.yml legacy-portal-tests ('11')
    class: migrate

  - name: auth-service
    path: services/auth-service
    build: gradle
    java: 17                     # sourceCompatibility = JavaVersion.VERSION_17
    framework: spring-boot 3.2.4
    dockerfile: gradle:8.6-jdk17 / eclipse-temurin:17-jre-jammy
    ci: docker-build.yml auth-service-tests (java-version '17'), ci.yml ('17')
    class: verify

  - name: notification-service
    path: services/notification-service
    build: gradle-kts
    java: 17                     # jvmToolchain(17)
    framework: ktor 2.3.9 (kotlin 1.9.23)
    dockerfile: gradle:8.6-jdk17 / eclipse-temurin:17-jre-jammy
    ci: ci.yml ('17')
    class: jdk-only

  - name: analytics-service
    path: services/analytics-service
    build: sbt
    java: 17                     # sbtscala/scala-sbt eclipse-temurin 17.0.10
    framework: akka-http 10.5.3 (scala 3.4.0)
    dockerfile: sbtscala/scala-sbt:eclipse-temurin-jammy-17.0.10_7_1.9.9_3.4.1 / eclipse-temurin:17-jre-jammy
    ci: ci.yml ('17')
    class: verify

# Out of scope: frontend/client-app/mobile/android is the Capacitor Android shell, not a
# backend JVM service. Its Gradle build is driven by AGP and requires JDK 21 per the repo
# blueprint; bumping it is not part of a backend Java 17 migration.

targets:
  java: 17
  spring_boot: 3.2.5
demo_mode: true
