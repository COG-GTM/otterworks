# Derived from the routes in services/api-gateway; keep in sync when routes change.
openapi: 3.0.3
info:
  title: OtterWorks API Gateway
  description: 'Go (chi) edge gateway: JWT validation, rate limiting, per-route circuit breakers, request
    IDs, CORS, and

    reverse-proxying to the backend services. Derived from `services/api-gateway/internal/config/config.go`
    (`ServiceRoutes`),

    `internal/proxy/router.go` and `internal/middleware/jwt.go`. Per-service request/response schemas
    live in the

    service-specific specs in this directory.'
  version: 1.0.0
  contact:
    name: OtterWorks Platform Team
  license:
    name: Proprietary
    url: https://github.com/COG-GTM/otterworks
servers:
- url: http://localhost:8080
  description: Local development (direct)
security:
- bearerAuth: []
tags:
- name: proxy
- name: ops
paths:
  /health:
    get:
      tags:
      - ops
      operationId: health
      summary: Gateway liveness probe
      security: []
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: &id001
                    type: string
                  version: *id001
  /metrics:
    get:
      tags:
      - ops
      operationId: metrics
      summary: Prometheus metrics
      security: []
      responses:
        '200':
          description: Prometheus exposition
          content:
            text/plain:
              schema: *id001
  /api/v1/auth/{proxyPath}:
    parameters:
    - name: proxyPath
      in: path
      required: true
      schema: *id001
      description: Remainder of the path, forwarded verbatim
    x-upstream-service: auth-service
    get:
      tags:
      - proxy
      operationId: proxyAuth
      summary: Reverse-proxy /api/v1/auth/* to auth-service
      description: 'All methods are forwarded. Full contract: `shared/openapi/auth-service.yaml`. Login/register/refresh
        are public paths (no JWT). Client-supplied `X-User-ID`/`X-User-Email` are stripped and re-injected
        from validated JWT claims (see docs/adr).'
      security: []
      responses:
        '200':
          description: Upstream response; see auth-service.yaml
        '401':
          description: Missing/invalid JWT
          content:
            application/json:
              schema: &id002
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limited
          content:
            application/json:
              schema: *id002
        '502':
          description: Upstream unavailable
          content:
            application/json:
              schema: *id002
        '503':
          description: Circuit breaker open
          content:
            application/json:
              schema: *id002
