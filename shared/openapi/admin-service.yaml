# Derived from the routes in services/admin-service; keep in sync when routes change.
openapi: 3.0.3
info:
  title: OtterWorks Admin Service
  description: 'Ruby on Rails admin API (users, features, config, quotas, incidents, chaos, integrations
    settings).

    Derived from `services/admin-service/config/routes.rb`. Bodies are loosely typed; see the controllers
    for field-level detail.'
  version: 1.0.0
  contact:
    name: OtterWorks Platform Team
  license:
    name: Proprietary
    url: https://github.com/COG-GTM/otterworks
servers:
- url: http://localhost:8089
  description: Local development (direct)
security:
- bearerAuth: []
tags:
- name: users
- name: features
- name: config
- name: audit
- name: quotas
- name: announcements
- name: incidents
- name: chaos
- name: settings
- name: ops
paths:
  /api/v1/admin/users:
    get:
      tags:
      - users
      operationId: listUsers
      summary: List users
      responses:
        '200':
          description: User list
          content:
            application/json:
              schema: &id002
                type: object
                additionalProperties: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: &id001
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Admin role required
          content:
            application/json:
              schema: *id001
  /api/v1/admin/users/{id}:
    parameters:
    - name: id
      in: path
      required: true
      schema: &id003
        type: string
    get:
      tags:
      - users
      operationId: getUser
      summary: Get user
      responses:
        '200':
          description: User
          content:
            application/json:
              schema: *id002
        '404':
          description: Not found
          content:
            application/json:
              schema: *id001
    put:
      tags:
      - users
      operationId: updateUser
      summary: Update user
      requestBody:
        required: true
        content:
          application/json:
            schema: *id002
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: *id002
        '404':
          description: Not found
          content:
            application/json:
              schema: *id001
        '422':
          description: Validation error
          content:
            application/json:
              schema: *id001
    delete:
      tags:
      - users
      operationId: deleteUser
      summary: Delete user
      responses:
        '204':
          description: Deleted
        '404':
          description: Not found
          content:
            application/json:
              schema: *id001
