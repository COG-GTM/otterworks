# User-preferences context -- GET/PUT /api/preferences/{userId}.
context: user-preferences
scenarios:
  - id: defaults
    steps:
      - name: unknown-user-gets-defaults
        request: {method: GET, path: /api/preferences/newuser}
      - name: defaults-are-not-persisted
        request: {method: GET, path: /api/preferences/newuser}

  - id: upsert
    steps:
      - name: create
        request:
          method: PUT
          path: /api/preferences/alice
          json: {theme: dark, locale: fr-FR, emailNotifications: false}
      - name: read-back
        request: {method: GET, path: /api/preferences/alice}
      - name: update
        request:
          method: PUT
          path: /api/preferences/alice
          json: {theme: light, locale: en-GB, emailNotifications: true}
      - name: read-updated
        request: {method: GET, path: /api/preferences/alice}
      - name: email-flag-omitted-defaults-false
        request:
          method: PUT
          path: /api/preferences/bob
          json: {theme: solarized, locale: de-DE}
      - name: other-users-isolated
        request: {method: GET, path: /api/preferences/newuser}

  - id: user-id-shapes
    steps:
      - name: email-like-id
        request:
          method: PUT
          path: /api/preferences/carol@example.com
          json: {theme: dark, locale: en-US, emailNotifications: true}
      - name: dotted-id-no-suffix-matching
        request: {method: GET, path: /api/preferences/alice.json}
      - name: url-encoded-space
        request: {method: GET, path: /api/preferences/dave%20smith}

  - id: validation
    steps:
      - name: blank-theme
        request: {method: PUT, path: /api/preferences/alice, json: {theme: "", locale: en-US}}
      - name: missing-locale
        request: {method: PUT, path: /api/preferences/alice, json: {theme: dark}}
      - name: locale-too-long
        request:
          method: PUT
          path: /api/preferences/alice
          json: {theme: dark, locale: {$repeat: "l", times: 21}}
      - name: theme-at-limit
        request:
          method: PUT
          path: /api/preferences/erin
          json: {theme: {$repeat: "t", times: 20}, locale: en-US}
      - name: bad-boolean
        request:
          method: PUT
          path: /api/preferences/alice
          json: {theme: dark, locale: en-US, emailNotifications: "sometimes"}
      - name: malformed-json
        request: {method: PUT, path: /api/preferences/alice, raw: "{", content_type: application/json}
      - name: failed-validation-did-not-write
        request: {method: GET, path: /api/preferences/alice}

  - id: routing-edges
    steps:
      - name: collection-root-not-routed
        request: {method: GET, path: /api/preferences}
      - name: post-not-allowed
        request: {method: POST, path: /api/preferences/alice, json: {theme: dark, locale: en-US}}
      - name: trailing-slash
        request: {method: GET, path: /api/preferences/alice/}
