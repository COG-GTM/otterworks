# Namespace-wide isolation for a GitOps env namespace (otterworks-<env>), the
# same shape deploy-tenant.sh applies to tenant namespaces: traffic only from
# pods in this namespace, the shared ingress controller, and monitoring.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: env-isolation
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
